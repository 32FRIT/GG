<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07130d">
  <meta name="description" content="GG — لعبة كروت كرة القدم: اختار 11 لاعب وابني فريقك">
  <title>GG — ألعاب الكورة</title>
  <link rel="icon" type="image/png" href="./Icon.png">
  <link rel="apple-touch-icon" href="./Icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    :root {
      --bg: #07130d;
      --bg2: #0a1a12;
      --card: #0f2619;
      --card2: #143322;
      --tx: #eef7f1;
      --mu: #8aa79a;
      --ac: #2ee08a;
      --ac-d: #0e6b46;
      --gold: #f5c451;
      --bad: #ff5d5d;
      --line: rgba(255, 255, 255, .09);
      --r: 16px;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: "Cairo", -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(70% 45% at 50% -8%, rgba(46, 224, 138, .16), transparent 70%),
        radial-gradient(60% 40% at 100% 100%, rgba(245, 196, 81, .07), transparent 70%),
        var(--bg);
    }

    #app {
      max-width: 520px;
      margin: 0 auto;
      padding: calc(14px + var(--sat)) calc(16px + var(--sar)) calc(28px + var(--sab)) calc(16px + var(--sal));
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation
    }

    button:focus-visible {
      outline: 2px solid var(--ac);
      outline-offset: 3px
    }

    h1,
    h2,
    h3,
    p {
      margin: 0
    }

    .mu {
      color: var(--mu)
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap
    }

    /* ---------- brand ---------- */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      flex: 0 0 auto;
      background: linear-gradient(150deg, #2ee08a, #0e6b46);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 17px;
      color: #04150d;
      letter-spacing: -.5px;
      box-shadow: 0 6px 18px rgba(46, 224, 138, .28);
    }

    .brand h1 {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -.3px;
      line-height: 1.1
    }

    .brand span {
      font-size: 12px;
      color: var(--mu);
      display: block;
      font-weight: 600
    }

    /* ---------- hero ---------- */
    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      padding: 22px 20px;
      background: linear-gradient(155deg, #123a26, #0b2016 60%, #0a1a12);
      border: 1px solid rgba(46, 224, 138, .22);
      margin-bottom: 18px;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset-inline-end: -40px;
      top: -40px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(46, 224, 138, .22), transparent 68%);
    }

    .hero h2 {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -.5px;
      position: relative
    }

    .hero p {
      font-size: 13.5px;
      color: var(--mu);
      margin-top: 8px;
      line-height: 1.7;
      position: relative;
      max-width: 30ch
    }

    .hero .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      position: relative;
      background: rgba(46, 224, 138, .13);
      color: var(--ac);
      border: 1px solid rgba(46, 224, 138, .3);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
    }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--ac);
      color: #04150d;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      min-height: 50px;
      transition: transform .12s ease, filter .12s ease;
      box-shadow: 0 6px 20px rgba(46, 224, 138, .22);
    }

    .btn:active {
      transform: scale(.975)
    }

    .btn:disabled {
      opacity: .4;
      box-shadow: none;
      cursor: not-allowed
    }

    .btn.g {
      background: transparent;
      color: var(--tx);
      border: 1.5px solid var(--line);
      box-shadow: none
    }

    .btn.g:active {
      background: rgba(255, 255, 255, .05)
    }

    .btn.w {
      width: 100%
    }

    .btn.sm {
      padding: 9px 14px;
      min-height: 40px;
      font-size: 13.5px;
      border-radius: 11px
    }

    /* ---------- mode cards ---------- */
    .mode {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      text-align: right;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 15px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: transform .12s ease, border-color .15s ease, background .15s ease;
    }

    .mode:active {
      transform: scale(.985);
      background: var(--card2)
    }

    .mode.primary {
      border-color: rgba(46, 224, 138, .4);
      background: linear-gradient(150deg, #123a26, #0d2418)
    }

    .mode .ic {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      background: rgba(46, 224, 138, .12);
      font-size: 20px;
    }

    .mode.primary .ic {
      background: rgba(46, 224, 138, .2)
    }

    .mode .tx {
      flex: 1;
      min-width: 0
    }

    .mode b {
      display: block;
      font-size: 15.5px;
      font-weight: 800;
      margin-bottom: 2px
    }

    .mode small {
      display: block;
      font-size: 12.5px;
      color: var(--mu);
      line-height: 1.5
    }

    .mode .arw {
      color: var(--mu);
      font-size: 18px;
      flex: 0 0 auto
    }

    /* ---------- header ---------- */
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px
    }

    .hdr .l {
      min-width: 0
    }

    .hdr .pos {
      font-size: 17px;
      font-weight: 900;
      display: block;
      line-height: 1.2
    }

    .hdr .cnt {
      font-size: 12px;
      color: var(--mu);
      font-weight: 600
    }

    .timer {
      flex: 0 0 auto;
      min-width: 56px;
      height: 44px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 19px;
      background: var(--card);
      border: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
      transition: color .2s, border-color .2s, background .2s;
    }

    .timer.warn {
      color: var(--bad);
      border-color: rgba(255, 93, 93, .45);
      background: rgba(255, 93, 93, .1)
    }

    .bar {
      height: 5px;
      background: rgba(255, 255, 255, .07);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px
    }

    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #2ee08a, #7ef0b8);
      border-radius: 99px;
      transition: width .2s linear
    }

    .bar i.warn {
      background: linear-gradient(90deg, #ff5d5d, #ff9a9a)
    }

    /* ---------- card grid ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(9px, 3vw, 14px)
    }

    .pick-grid {
      align-items: start;
      margin-inline: auto;
      width: 100%
    }

    .formation-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 18px
    }

    .formation-option {
      min-height: 60px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      text-align: center;
      cursor: pointer
    }

    .formation-option.active {
      border-color: var(--ac);
      background: rgba(46, 224, 138, .12);
      color: var(--ac)
    }

    .formation-option b {
      display: block;
      direction: ltr;
      font-size: 15px;
      font-weight: 900
    }

    .formation-option small {
      display: block;
      margin-top: 2px;
      color: var(--mu);
      font-size: 10.5px
    }

    .pitch {
      display: grid;
      gap: clamp(6px, 2vw, 10px);
      padding: clamp(10px, 3vw, 16px) clamp(6px, 2vw, 12px);
      border: 1px solid rgba(46, 224, 138, .22);
      border-radius: 16px;
      overflow: hidden;
      background:
        linear-gradient(90deg, transparent 49.7%, rgba(255, 255, 255, .1) 49.7% 50.3%, transparent 50.3%),
        repeating-linear-gradient(0deg, #123a26 0 42px, #103321 42px 84px);
    }

    .pitch-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      min-width: 0
    }

    .pitch-player {
      flex: 1 1 0;
      min-width: 0;
      max-width: 100px;
      padding: clamp(5px, 1.7vw, 8px) 2px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 10px;
      background: rgba(7, 19, 13, .84);
      text-align: center
    }

    .pitch-player small {
      display: block;
      color: var(--ac);
      font-size: clamp(8px, 2.4vw, 10px);
      font-weight: 800
    }

    .pitch-player b {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      font-size: clamp(8px, 2.7vw, 11px);
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .rating-compare {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px
    }

    .coach-compare {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px
    }

    .coach-compare-item {
      min-width: 0;
      text-align: center
    }

    .coach-compare-title {
      min-height: 36px;
      margin-bottom: 6px;
      color: var(--mu);
      font-size: 11px;
      font-weight: 700
    }

    .coach-compare-item .fcwrap {
      width: 100%;
      max-width: 190px;
      margin: 0 auto
    }

    .rating-card {
      padding: 12px 8px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      text-align: center
    }

    .rating-card .label {
      color: var(--mu);
      font-size: 12px;
      font-weight: 700
    }

    .rating-card .value {
      margin-top: 2px;
      color: var(--ac);
      font-size: 32px;
      font-weight: 900;
      line-height: 1.2;
      font-variant-numeric: tabular-nums
    }

    .rating-card.opponent .value {
      color: var(--gold)
    }

    .rating-card small {
      display: block;
      margin-top: 3px;
      color: var(--mu);
      font-size: 10px
    }

    @media (min-width:430px) {
      .grid {
        gap: 15px
      }
    }

    /* ---------- football card ---------- */
    .fc {
      position: relative;
      container-type: inline-size;
      width: 100%;
      aspect-ratio: 3/4.05;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 7% 6% 6%;
      text-align: center;
      direction: ltr;
      clip-path: polygon(50% 0, 100% 6%, 100% 91%, 50% 100%, 0 91%, 0 6%);
      background: linear-gradient(160deg, var(--g1), var(--g2) 52%, var(--g1));
      color: var(--c1);
      user-select: none;
      border: 1px solid rgba(255, 255, 255, .24);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .32), inset 0 0 0 2px rgba(255, 255, 255, .07);
      transition: transform .16s ease, box-shadow .18s ease, filter .18s ease;
    }

    .fc::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg, rgba(255, 255, 255, .22) 0%, transparent 38%, transparent 62%, rgba(255, 255, 255, .1) 100%);
      mix-blend-mode: overlay;
    }

    .t-icon {
      --g1: #1a1206;
      --g2: #4a3409;
      --c1: #f7d97a
    }

    .t-elite {
      --g1: #08182f;
      --g2: #1d4f8c;
      --c1: #f7d97a
    }

    .t-gold {
      --g1: #8a6410;
      --g2: #eec95f;
      --c1: #2a1d00
    }

    .t-silver {
      --g1: #78838b;
      --g2: #e2eaef;
      --c1: #1d2429
    }

    .t-bronze {
      --g1: #74441f;
      --g2: #d99a63;
      --c1: #2a1608
    }

    .fc-top {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1;
      position: relative;
      z-index: 1
    }

    .fc-top b {
      font-size: 17cqw;
      font-weight: 900;
      letter-spacing: -.04em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .22)
    }

    .fc-top i {
      font-style: normal;
      font-size: 6.6cqw;
      font-weight: 800;
      opacity: .85;
      margin-top: .6cqw
    }

    .fc-era {
      position: absolute;
      top: 8cqw;
      inset-inline-end: 6cqw;
      z-index: 1;
      font-size: 5.2cqw;
      font-weight: 800;
      opacity: .8;
      letter-spacing: .02em;
      padding: 1.8cqw 3.4cqw;
      border: 1px solid currentColor;
      border-radius: 999px;
      background: rgba(0, 0, 0, .13);
    }

    .fc-mono {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 0;
      font-size: 52cqw;
      font-weight: 900;
      opacity: .13;
      line-height: 1;
      padding-top: 6cqw;
    }

    .fc-name {
      margin-top: auto;
      font-size: 9.4cqw;
      font-weight: 900;
      line-height: 1.15;
      direction: rtl;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      position: relative;
      z-index: 1;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .12);
    }

    .fc-rule {
      height: 1.5px;
      background: currentColor;
      opacity: .35;
      margin: 2.6cqw 4cqw 2.2cqw;
      position: relative;
      z-index: 1
    }

    .fc-meta {
      font-size: clamp(8px, 6.2cqw, 12px);
      font-weight: 700;
      line-height: 1.35;
      direction: rtl;
      opacity: .9;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      position: relative;
      z-index: 1
    }

    /* hidden / back card */
    .fc.back {
      background: repeating-linear-gradient(135deg, #0b1f16 0 9px, #0e271b 9px 18px);
      color: var(--ac);
      display: grid;
      place-items: center;
      border: 0;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(46, 224, 138, .18);
      transition: transform .14s ease, box-shadow .18s ease, filter .18s ease;
    }

    .fc.back span {
      font-size: 22cqw;
      font-weight: 900;
      letter-spacing: .06em;
      opacity: .9
    }

    .fc.back:active {
      transform: scale(.97);
      filter: brightness(1.2)
    }

    .fc.back:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
      z-index: 2
    }

    @media (hover:hover) {
      .fc.back:not(:disabled):hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 26px rgba(0, 0, 0, .42), inset 0 0 0 1px rgba(46, 224, 138, .4)
      }
    }

    .fc.back.used {
      opacity: .28;
      pointer-events: none
    }

    .fc.back.used span {
      font-size: 9cqw
    }

    /* selection states */
    .fc.pick {
      animation: pop .32s cubic-bezier(.2, 1.3, .4, 1) both
    }

    @keyframes pop {
      from {
        transform: scale(.9);
        opacity: .4
      }

      to {
        transform: scale(1);
        opacity: 1
      }
    }

    .fc.dim {
      opacity: .32;
      filter: saturate(.4)
    }

    .fc.win {
      box-shadow: 0 0 0 2px #2ee08a, 0 10px 26px rgba(46, 224, 138, .28), inset 0 0 0 2px rgba(255, 255, 255, .09)
    }

    .fc.lose {
      box-shadow: 0 0 0 2px #ff5d5d, 0 10px 26px rgba(255, 93, 93, .23), inset 0 0 0 2px rgba(255, 255, 255, .08)
    }

    .badge {
      position: absolute;
      top: -7px;
      inset-inline-end: -7px;
      z-index: 3;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 900;
      color: #04150d;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .4);
    }

    .badge.ok {
      background: #2ee08a
    }

    .badge.no {
      background: #ff5d5d;
      color: #fff
    }

    .fcwrap {
      position: relative;
      min-width: 0;
      filter: drop-shadow(0 5px 8px rgba(0, 0, 0, .2))
    }

    .pick-actions {
      display: grid;
      gap: 9px;
      margin-top: 16px
    }

    .pick-actions .btn {
      width: 100%;
      min-height: 52px
    }

    .pick-stage {
      position: relative;
      isolation: isolate
    }

    .pick-stage-grid {
      filter: blur(2px);
      opacity: .3;
      transform: scale(.97);
      transition: filter .2s ease, opacity .2s ease, transform .2s ease;
      pointer-events: none
    }

    .pick-card-stack {
      position: relative;
      isolation: isolate;
      width: min(100%, 260px, 42dvh);
      aspect-ratio: 3/4.05;
      margin-inline: auto
    }

    .pick-card-stack .stack-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      filter: blur(1.4px);
      opacity: .72;
      transform-origin: center 85%;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .48)
    }

    .pick-card-stack .stack-back:nth-child(1) {
      z-index: 1;
      transform: rotate(-8deg) translateX(-15px) scale(.96)
    }

    .pick-card-stack .stack-back:nth-child(2) {
      z-index: 2;
      transform: rotate(-3deg) translateY(-4px) scale(.98)
    }

    .pick-card-stack .stack-back:nth-child(3) {
      z-index: 3;
      transform: rotate(8deg) translateX(15px) scale(.96)
    }

    .pick-card-front {
      position: absolute;
      inset: 0;
      z-index: 4;
      filter: drop-shadow(0 12px 20px rgba(0, 0, 0, .48))
    }

    .pick-card-front .fc {
      height: 100%
    }

    .pick-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: calc(18px + var(--sat)) calc(18px + var(--sar)) calc(18px + var(--sab)) calc(18px + var(--sal));
      overflow-y: auto;
      background: rgba(2, 10, 6, .62);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      animation: overlay-in .18s ease both
    }

    .pick-dialog {
      width: min(100%, 340px);
      max-height: calc(100dvh - 36px - var(--sat) - var(--sab));
      overflow-y: auto;
      overflow-x: clip;
      padding: clamp(14px, 4vw, 20px);
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 22px;
      background: linear-gradient(160deg, rgba(17, 43, 29, .97), rgba(7, 19, 13, .98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .58), 0 0 36px rgba(46, 224, 138, .09);
      text-align: center;
      animation: card-zoom-in .32s cubic-bezier(.2, 1.15, .35, 1) both
    }

    .pick-dialog-title {
      margin-bottom: 12px;
      color: var(--mu);
      font-size: 13px;
      font-weight: 700
    }

    .pick-dialog .pick-actions {
      margin-top: 16px
    }

    @keyframes overlay-in {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes card-zoom-in {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.72)
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }

    /* ---------- squad strip ---------- */
    .squad {
      margin-top: 18px
    }

    .squad .lbl {
      font-size: 11.5px;
      color: var(--mu);
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between
    }

    .slots {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none
    }

    .slots::-webkit-scrollbar {
      display: none
    }

    .slot {
      flex: 0 0 auto;
      min-width: 52px;
      height: 34px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 10.5px;
      font-weight: 700;
      background: rgba(255, 255, 255, .04);
      border: 1px dashed rgba(255, 255, 255, .12);
      color: var(--mu);
      padding: 0 8px;
      white-space: nowrap;
    }

    .slot.on {
      background: rgba(46, 224, 138, .13);
      border: 1px solid rgba(46, 224, 138, .35);
      color: var(--ac)
    }

    .slot.now {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(245, 196, 81, .1)
    }

    /* ---------- reveal / opp ---------- */
    .note {
      font-size: 13px;
      color: var(--mu);
      line-height: 1.7;
      margin: 14px 0 0;
      text-align: center
    }

    .note b {
      color: var(--tx)
    }

    .sec-title {
      font-size: 15px;
      font-weight: 800;
      margin: 20px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .sec-title::before {
      content: "";
      width: 3px;
      height: 15px;
      border-radius: 2px;
      background: var(--ac)
    }

    /* ---------- result ---------- */
    .score {
      font-size: clamp(46px, 15vw, 64px);
      font-weight: 900;
      line-height: 1;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
    }

    .verdict {
      font-size: 19px;
      font-weight: 900;
      margin-top: 6px
    }

    .rows {
      margin-top: 16px;
      border-radius: var(--r);
      overflow: hidden;
      border: 1px solid var(--line)
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      font-size: 13.5px
    }

    .row:last-child {
      border-bottom: 0
    }

    .row .r {
      color: var(--mu);
      font-size: 12px;
      font-weight: 700;
      flex: 0 0 auto
    }

    .row .n {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .row .v {
      font-weight: 900;
      color: var(--ac);
      flex: 0 0 auto;
      font-variant-numeric: tabular-nums
    }

    /* ---------- misc ---------- */
    .input {
      width: 100%;
      padding: 14px;
      border-radius: 13px;
      border: 1.5px solid var(--line);
      background: var(--card);
      color: var(--tx);
      font: inherit;
      font-size: 20px;
      text-align: center;
      letter-spacing: .3em;
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 12px;
    }

    .input::placeholder {
      letter-spacing: normal;
      font-size: 14px;
      font-weight: 600;
      color: var(--mu);
      text-transform: none
    }

    .input:focus {
      outline: none;
      border-color: var(--ac)
    }

    .toast {
      position: fixed;
      inset-inline: 0;
      bottom: calc(22px + var(--sab));
      z-index: 99;
      display: flex;
      justify-content: center;
      pointer-events: none;
      padding: 0 16px;
    }

    .toast i {
      background: #eef7f1;
      color: #07130d;
      padding: 10px 18px;
      border-radius: 12px;
      font-style: normal;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
      animation: tin .22s ease both;
      max-width: 100%;
      text-align: center;
    }

    @keyframes tin {
      from {
        transform: translateY(10px);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .spin {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      margin: 0 auto 16px;
      border: 3px solid rgba(46, 224, 138, .2);
      border-top-color: var(--ac);
      animation: sp .8s linear infinite;
    }

    @keyframes sp {
      to {
        transform: rotate(360deg)
      }
    }

    .center {
      text-align: center
    }

    .mt {
      margin-top: 16px
    }

    .mt-s {
      margin-top: 10px
    }

    .foot {
      margin-top: auto;
      padding-top: 22px;
      text-align: center;
      font-size: 11px;
      color: var(--mu);
      opacity: .7
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important
      }
    }

    @media (max-width:360px) {
      #app {
        padding-inline: calc(12px + var(--sar)) calc(12px + var(--sal))
      }

      .fc {
        border-radius: 12px
      }

      .coach-compare {
        gap: 7px
      }

      .coach-compare-title {
        font-size: 10px
      }

      .pitch-row {
        gap: 4px
      }

      .pick-overlay {
        padding-inline: calc(14px + var(--sar)) calc(14px + var(--sal))
      }

      .pick-dialog {
        border-radius: 18px
      }
    }
  </style>
</head>

      stopNetMonitor();
      lastNetMessage = Date.now();
      netHeartbeat = setInterval(() => {
        if (conn !== connection) {
          stopNetMonitor();
          return;
        }
        if (!connection.open || Date.now() - lastNetMessage > 12000) {
          handleOpponentDisconnect(connection);
          return;

        try { connection.send({ t: "ping" }) }
        catch (e) { handleOpponentDisconnect(connection) }

    function scheduleNextRound() {
      if (advanceTimer) return;

      const tick = () => {
        if (!S || S.phase !== "opp") {
          clearInterval(advanceTimer);
          advanceTimer = null;
          return;
        }
        const left = Math.max(0, Math.ceil((advanceAt - Date.now()) / 1000));
        const label = $("advance");
        if (label) label.textContent = left ? `الجولة التالية بعد ${left} ثواني` : "الجولة التالية...";
        if (left <= 0) {
          clearInterval(advanceTimer);

    function startGame() {

      S = { i: 0, team: [], used: new Set(), pool: [], shown: new Set(), sw: 1, phase: "pick", sel: null, formation: selectedFormation, slots: formationSlots(selectedFormation), coach: null, coachPool: [], coachShown: new Set(), coachSwap: 1 };

    function round() {
      clearInterval(advanceTimer);
      advanceTimer = null;
      clearTimeout(phaseTimeout);
      phaseTimeout = null;
      if (S.i >= 11) return startCoachDraft();
      S.pool = mkPool(S.slots[S.i], S.used);
      S.shown = new Set();
      S.sw = 1;
      S.phase = "pick";
      S.sel = null;
      tEnd = Date.now() + TM * 1000;
      drawPick();
      startTimer(TM, () => {
        if (S.phase !== "pick") return;
        const available = S.pool
          .map((x, k) => S.shown.has(x.n) ? null : k)
          .filter(k => k !== null);
        const k = S.sel != null && !S.shown.has(S.pool[S.sel].n)
          ? S.sel
          : available[Math.floor(Math.random() * available.length)];
        if (k != null) keepPick(k);
      });
    }

    function mkPool(pos, used) {
      const av = P.filter(x => x.p === pos && !used.has(x.n));
      const st = shuffle(av.filter(x => x.r >= 88));
      const md = shuffle(av.filter(x => x.r >= 75 && x.r < 88));
      const wk = shuffle(av.filter(x => x.r < 75));
      const pool = [st[0], md[0], wk[0], wk[1]].filter(Boolean);
      shuffle(av).forEach(x => { if (pool.length < 4 && !pool.includes(x)) pool.push(x) });
      return shuffle(pool);
    }

        if (S.coachShown.has(S.coachPool[k].n)) return;
        if (S.coachSwap === 0) {
          chooseCoach(k);
          return;
        }
        S.coachSel = k;
        drawCoachPick();
      });
      const keep = $("coachKeep");
      if (keep) keep.onclick = () => chooseCoach(S.coachSel);
      const change = $("coachChange");
      if (change) change.onclick = () => {
        S.coachSwap--;
        S.coachShown.add(S.coachPool[S.coachSel].n);
        S.coachSel = null;
        drawCoachPick();
      };
    }

    function chooseCoach(k) {
      if (!S || S.phase !== "coach-pick") return;
      const coach = S.coachPool[k];
      if (!coach || S.coachShown.has(coach.n)) return;
      S.coach = coach;
      stopTimer();
      endGame();
    }

    function drawPick() {
      S.phase = "pick";
      app.innerHTML = headerHTML() +
        `<p class="note">كل الكروت مخفية — اختار كارت وجرّب حظك.<br><b>${S.sw > 0 ? "عندك تغيير واحد في المركز ده" : "خلص تغييرك في المركز ده"}</b></p>
     <div class="grid pick-grid" style="margin-top:14px">
       ${S.pool.map((x, k) => backHTML(k, S.shown.has(x.n))).join("")}
     </div>`+ squadHTML();
      bindQuitButton();
      app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
        const k = +b.dataset.k;
        if (S.shown.has(S.pool[k].n)) return;
        buzz(6); sfxPick();
        drawCard(k);
      });
    }

    function drawCard(k) {
      S.sel = k;
      const x = S.pool[k];
      if (S.sw === 0) {
        keepPick(k);
        return;
      }
      const hidden = S.pool.filter(y => !S.shown.has(y.n)).length;
      const canSwap = S.sw > 0 && hidden > 1;
      app.innerHTML = headerHTML() +
        `<p class="note">الكارت اللي اخترته ظهر لك — ضمّه لفريقك أو غيّره.</p>
     <div class="pick-stage" style="margin-top:14px">
       <div class="grid pick-grid pick-stage-grid" aria-hidden="true">
         ${S.pool.map(() => `<div class="fc back"><span>GG</span></div>`).join("")}
       </div>
       <div class="pick-overlay">
         <div class="pick-dialog" role="dialog" aria-modal="true" aria-label="الكارت الذي اخترته">
           <div class="pick-dialog-title">الكارت اللي اخترته</div>
           ${pickStackHTML(cardHTML(x, "pick"))}
           <div class="pick-actions">
             <button class="btn w" id="keep">ضمّه للفريق</button>
             ${canSwap ? `<button class="btn g w" id="chg">غيّر الكارت (${S.sw} متاح)</button>` : ""}
           </div>
         </div>
       </div>
     </div>`+ squadHTML();
      bindQuitButton();
      $("keep").onclick = () => { buzz(10); sfxGood(); keepPick(k) };
      const cg = $("chg");
      if (cg) cg.onclick = () => {
        S.sw--; S.shown.add(x.n); S.sel = null; buzz(6); sfxBad();
        drawPick();
      };
    }

    function keepPick(k) {
      if (S.phase !== "pick") return;
      const x = S.pool[k];
      if (!x || S.shown.has(x.n)) return;
      S.phase = "reveal";
      stopTimer();
      S.team.push(x);
      S.used.add(x.n);
      if (conn && conn.open) {
        try { conn.send({ t: "pick", i: S.i, n: x.n, s: [...S.shown][0] || null, p: S.pool.map(y => y.n) }) } catch (e) { }
      }
      revealAll(k);
    }

    function revealAll(sel) {
      const x = S.pool[sel];
      app.innerHTML = headerHTML() +
        `<p class="note">كروتك اتكشفت</p>
     <div class="grid pick-grid" style="margin-top:12px">
       ${S.pool.map((y, k) => {
          const isPick = y.n === x.n;
          const wasShown = S.shown.has(y.n);
          const cls = isPick ? "pick win" : (wasShown ? "dim" : "");
          const badge = isPick ? `<div class="badge ok">✓</div>` : (wasShown ? `<div class="badge no">✕</div>` : "");
          return `<div class="fcwrap">${badge}${cardHTML(y, cls)}</div>`;
        }).join("")}
     </div>
     <p class="note">اختيار الخصم بعد ثواني...</p>`+ squadHTML();
      bindQuitButton();
      phaseTimeout = setTimeout(() => {
        phaseTimeout = null;
        if (S && S.phase === "reveal") oppPhase();
      }, 2200);
    }

    function oppPhase() {
      S.phase = "opp";
      app.innerHTML = headerHTML() +
        `<div class="sec-title">اختيارك</div>
     <div class="fcwrap" style="max-width:180px;margin:0 auto">${cardHTML(S.team[S.i], "win")}</div>
     <div class="sec-title">اختيار الخصم</div>
        <div id="op"><p class="note">الخصم لسه مختارش...</p></div>
        <p class="note" id="advance"></p>`;
      bindQuitButton();
      stopTimer();
      const t = $("tm"); if (t) t.textContent = "—";
      const b = $("bar"); if (b) b.style.width = "100%";
      const settle = () => {
        if (!S || S.phase !== "opp") return;
        if (!OPPK[S.i]) {
          if (conn) {
            const box = $("op");
            if (box) box.innerHTML = `<p class="note">مستني اختيار الخصم...</p>`;
            return;
          }
          const pool = OPPP[S.i] || S.pool.map(y => y.n);
          OPPK[S.i] = pool[Math.floor(Math.random() * pool.length)];
        }
        paintOpp();
      };
      phaseTimeout = setTimeout(() => {
        phaseTimeout = null;
        settle();
      }, 900);
    }

    function paintOpp() {
      const box = $("op"); if (!box) return;
      const n = OPPK[S.i];
      if (!n) { box.innerHTML = `<p class="note">الخصم لسه مختارش...</p>`; return }
      const s = OPPS[S.i];
      const pl = (OPPP[S.i] || [n, s]).filter(Boolean);
      box.innerHTML = `<div class="grid pick-grid">
    ${pl.map(z => {
        const p = P.find(y => y.n === z); if (!p) return "";
        const isOpp = z === n, isSwap = z === s;
        const cls = isOpp ? "win" : (isSwap ? "lose" : "dim");
        const badge = isOpp ? `<div class="badge ok">✓</div>` : (isSwap ? `<div class="badge no">✕</div>` : "");
        return `<div class="fcwrap">${badge}${cardHTML(p, cls)}</div>`;
      }).join("")}
  </div>
  <p class="note">${s ? "الأخضر اختاره، والأحمر غيّره" : "اختار من أول كارت من غير تغيير"}</p>`;
      stopTimer();
      scheduleNextRound();
    }

    /* ================= END ================= */
    function endGame() {
      cancelGameTimers();
      const baseAvg = Math.round(S.team.reduce((a, t) => a + t.r, 0) / 11);
      const avg = coachAdjustedPower(baseAvg, S.coach);
      app.innerHTML = `
    <div id="match" class="mt"></div>
    <div class="rating-compare" id="rating-compare">
      <div class="rating-card">
        <div class="label">تقييم فريقك</div>
        <div class="value">${avg}</div>
        <small>${esc(S.coach.n)} · ${formationById(S.formation).id}</small>
      </div>
      <div class="rating-card opponent">
        <div class="label">تقييم الخصم</div>
        <div class="value">—</div>
        <small>مستني بيانات فريقه</small>
      </div>
    </div>
    <div class="sec-title">المدربين</div>
    <div class="coach-compare" id="coach-compare">
      <div class="coach-compare-item">
        <div class="coach-compare-title">مدربك · ${esc(S.coach.n)}</div>
        <div class="fcwrap">${coachCardHTML(S.coach, "win")}</div>
      </div>
      <div class="coach-compare-item">
        <div class="coach-compare-title">مدرب الخصم · في انتظار بياناته</div>
        <div class="fcwrap"><div class="fc back" aria-hidden="true"><span>؟</span></div></div>
      </div>
    </div>
    <p class="note">قوة اللاعبين ${baseAvg} × تأثير المدرب ${coachMultiplier(S.coach).toFixed(3)} = <b>${avg}</b></p>
    ${formationHTML(S.team, S.formation, "خطة فريقك")}
    <div id="opp-formation">
      <div class="sec-title">خطة الخصم</div>
      <p class="note">مستني بيانات خطة الخصم...</p>
    </div>
    <div class="mt" style="display:flex;gap:10px">
      <button class="btn" id="again" style="flex:1">العب تاني</button>
      <button class="btn g" id="hm" style="flex:1">الرئيسية</button>
    </div>`;
      $("again").onclick = () => { killNet(); screenModes() };
      $("hm").onclick = () => { killNet(); screenHome() };
      runMatch(avg);
    }

    function runMatch(me) {
      const box = $("match"); if (!box) return;
      const mt = { avg: me, baseAvg: Math.round(S.team.reduce((a, t) => a + t.r, 0) / 11), names: S.team.map(t => t.n), formation: S.formation, slots: S.slots, coach: S.coach };
      const oppFormation = $("opp-formation");
      if (oppFormation) {
        oppFormation.innerHTML = OPP
          ? formationHTML(OPP.names.map(n => P.find(p => p.n === n)).filter(Boolean), OPP.formation, "خطة الخصم")
          : `<div class="sec-title">خطة الخصم</div><p class="note">مستني بيانات خطة الخصم...</p>`;
      }
      const coaches = $("coach-compare");
      if (coaches) {
        coaches.innerHTML = `<div class="coach-compare-item">
        <div class="coach-compare-title">مدربك · ${esc(S.coach.n)}</div>
        <div class="fcwrap">${coachCardHTML(S.coach, "win")}</div>
      </div>
      <div class="coach-compare-item">
        <div class="coach-compare-title">${OPP ? `مدرب الخصم · ${esc(OPP.coach.n)}` : "مدرب الخصم · في انتظار بياناته"}</div>
        <div class="fcwrap">${OPP ? coachCardHTML(OPP.coach, "win") : `<div class="fc back" aria-hidden="true"><span>؟</span></div>`}</div>
      </div>`;
      }
      if (!OPP) {
        const comparison = $("rating-compare");
        if (comparison) {
          comparison.innerHTML = `<div class="rating-card">
        <div class="label">تقييم فريقك</div>
        <div class="value">${me}</div>
        <small>${esc(S.coach.n)} · ${formationById(S.formation).id}</small>
      </div>
      <div class="rating-card opponent">
        <div class="label">تقييم الخصم</div>
        <div class="value">—</div>
        <small>مستني الخصم يخلص فريقه</small>
      </div>`;
        }
        box.innerHTML = `<div class="rows"><div class="row"><span class="n">مستني الخصم يخلص فريقه...</span></div></div>`;
        window.__showOpp = () => { window.__showOpp = null; runMatch(me) };
        if (conn && conn.open) {
          try { conn.send({ t: "team", avg: me, baseAvg: mt.baseAvg, names: mt.names, formation: mt.formation, coach: mt.coach.n }) }
          catch (e) { handleOpponentDisconnect(conn) }
        }
        return;
      }
      const comparison = $("rating-compare");
      if (comparison) {
        comparison.innerHTML = `<div class="rating-card">
        <div class="label">تقييم فريقك</div>
        <div class="value">${me}</div>
        <small>${esc(S.coach.n)} · ${formationById(S.formation).id}</small>
      </div>
      <div class="rating-card opponent">
        <div class="label">تقييم الخصم</div>
        <div class="value">${OPP.avg}</div>
        <small>${esc(OPP.coach.n)} · ${formationById(OPP.formation).id}</small>
      </div>`;
      }
      const r = simulate(mt, OPP);
      const evs = r.ev.map(e => ({ m: e.m, who: e.who, me: (e.s === "A") === r.mine }));
      box.innerHTML = `
    <div class="sec-title">المباراة</div>
    <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--mu)">
        <span style="flex:1;text-align:right">أنت · ${me} · <b dir="ltr">${formationById(S.formation).id}</b> · ${esc(S.coach.n)}</span>
        <span style="flex:1;text-align:left">${esc(OPP.name)} · ${OPP.avg} · <b dir="ltr">${formationById(OPP.formation).id}</b> · ${esc(OPP.coach.n)}</span>
      </div>
      <div class="score" id="sc" style="font-size:clamp(38px,12vw,52px);margin:8px 0 4px">0 - 0</div>
      <div id="mn" style="font-size:13px;font-weight:800;color:var(--mu)">0'</div>
      <div id="lg" style="margin-top:12px;text-align:right"></div>
    </div>`;
      let m = 0, a = 0, b = 0;
      const t = setInterval(() => {
        if (!$("sc")) { clearInterval(t); return }
        m += 2;
        evs.filter(e => e.m <= m && e.m > m - 2).forEach(e => {
          if (e.me) a++; else b++;
          sfxGoal();
          $("lg").insertAdjacentHTML("beforeend",
            `<div class="row" style="padding:8px 0;background:transparent;border-color:rgba(255,255,255,.06)">
          <span class="n" style="font-size:12.5px">⚽ ${e.m}' ${esc(e.who)}</span>
          <span class="r" style="font-size:11px">${e.me ? "فريقك" : esc(OPP.name)}</span>
        </div>`);
        });
        $("sc").textContent = a + " - " + b;
        $("mn").textContent = Math.min(m, 90) + "'";
        if (m >= 90) {
          clearInterval(t);
          const win = a > b, draw = a === b;
          $("mn").innerHTML = `<span style="color:${win ? "var(--ac)" : draw ? "var(--gold)" : "var(--bad)"};font-size:15px">${win ? "كسبت 🏆" : draw ? "تعادل" : "خسرت"}</span>`;
          if (win) buzz([20, 60, 20]);
        }
      }, 70);
    }

    /* ================= SIMULATION ================= */
    function rng32(s) {
      return () => {
        s |= 0; s = s + 0x6D2B79F5 | 0;
        let t = Math.imul(s ^ s >>> 15, 1 | s);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function hs(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) }
      return h >>> 0;
    }
    function pois(l, r) {
      const L = Math.exp(-l); let k = 0, p = 1;
      do { k++; p *= r() } while (p > L && k < 40);
      return k - 1;
    }
    function simulate(me, opp) {
      const key = x => x.names.join(",") + "|" + x.avg + "|" + x.formation + "|" + (x.coach ? x.coach.n : "");
      const mineFirst = key(me) <= key(opp);
      const A = mineFirst ? me : opp, B = mineFirst ? opp : me;
      const r = rng32(hs(key(A) + "#" + key(B)));
      const d = A.avg - B.avg;
      let ga = pois(Math.max(.35, 1.35 + d * .11), r);
      let gb = pois(Math.max(.35, 1.35 - d * .11), r);
      if (d > 0 && ga <= gb) ga = gb + 1;
      if (d < 0 && gb <= ga) gb = ga + 1;
      const pickScorer = x => {
        const slots = x.slots || formationSlots(x.formation);
        const w = x.names.map((n, k) => slots[k] === "F" ? 5 : slots[k] === "M" ? 2 : slots[k] === "D" ? 1 : 0);
        const total = w.reduce((s, v) => s + v, 0);
        if (!total) return x.names[0];
        let t = total * r(), k = 0;
        while (k < w.length - 1 && t >= w[k]) { t -= w[k]; k++ }
        return x.names[k];
      };
      const ev = [];
      for (let i = 0; i < ga; i++) ev.push({ m: 1 + Math.floor(r() * 90), s: "A", who: pickScorer(A) });
      for (let i = 0; i < gb; i++) ev.push({ m: 1 + Math.floor(r() * 90), s: "B", who: pickScorer(B) });
      ev.sort((x, y) => x.m - y.m);
      return { mine: mineFirst, ev };
    }

    /* ================= AI OPPONENT ================= */
    function aiTeam(formationId) {
      let sum = 0; const names = [], sws = [], pools = [], used = new Set();
      const slots = formationSlots(formationId);
      slots.forEach(p => {
        const c = mkPool(p, used);
        let i = 0;
        if (c[0] && c[0].r < 80 && c[1]) i = 1;
        const x = c[i] || c[0];
        sws.push(i ? c[0].n : null);
        pools.push(c.map(z => z.n));
        used.add(x.n);
        names.push(x.n);
        sum += x.r;
      });
      const baseAvg = Math.round(sum / 11);
      const coach = COACHES[Math.floor(Math.random() * COACHES.length)];
      return { avg: coachAdjustedPower(baseAvg, coach), baseAvg, names, sws, pools, name: "الكمبيوتر", formation: formationId, slots, coach };
    }

    /* ================= NETWORK (PeerJS) ================= */
    function killNet() {
      stopNetMonitor();
      try { conn && conn.close() } catch (e) { }
      try { peer && peer.destroy() } catch (e) { }
      conn = null; peer = null;
    }
    function netFail(msg) {
      killNet();
      toast(msg || "مشكلة في الاتصال");
      setTimeout(screenModes, 600);
    }
    function hostRoom(code, lobby) {
      resetOpponent();
      if (typeof Peer === "undefined") return netFail("مكتبة الاتصال لسه بتحمّل، جرّب تاني");
      killNet();
      try { peer = new Peer("ggf-" + code) } catch (e) { return netFail() }
      peer.on("open", () => {
        if (lobby) screenWait("بندور على لاعب", "هنتوصل بأول لاعب متاح...");
        else screenWait("الغرفة جاهزة", "ابعت الكود لصاحبك", code);
      });
      peer.on("connection", c => {
        conn = c;
        link(true);
      });
      peer.on("error", e => {
        if (lobby && e && e.type === "unavailable-id") joinRoom("lobby");
        else netFail("مش قادر أفتح الغرفة");
      });
    }
    function joinRoom(code) {
      resetOpponent();
      if (typeof Peer === "undefined") return netFail("مكتبة الاتصال لسه بتحمّل، جرّب تاني");
      killNet();
      screenWait("بندخل الغرفة", "بنوصل بصاحبك...");
      try { peer = new Peer() } catch (e) { return netFail() }
      peer.on("open", () => {
        conn = peer.connect("ggf-" + code, { reliable: true });
        link(false);
      });
      peer.on("error", () => netFail("مفيش غرفة بالكود ده"));
    }
    function link(isHost) {
      if (!conn) return;
      const connection = conn;
      connection.on("data", d => {
        if (!d || !d.t) return;
        lastNetMessage = Date.now();
        if (d.t === "ping") {
          try { connection.send({ t: "pong" }) }
          catch (e) { handleOpponentDisconnect(connection) }
          return;
        }
        if (d.t === "pong") return;
        if (d.t === "resign") {
          cancelGameTimers();
          S = null;
          killNet();
          resetOpponent();
          toast("الخصم انسحب من المباراة");
          screenModes();
          return;
        }
        if (d.t === "hello" && isHost) {
          opponentFormation = formationById(d.formation).id;
          try { connection.send({ t: "cfg", tm: TM, formation: selectedFormation }) }
          catch (e) { handleOpponentDisconnect(connection); return }
          startGame();
        }
        if (d.t === "cfg" && !isHost) {
          TM = d.tm || TM;
          opponentFormation = formationById(d.formation).id;
          startGame();
        }
        if (d.t === "pick") {
          OPPK[d.i] = d.n; OPPS[d.i] = d.s; OPPP[d.i] = d.p;
          if (S && S.phase === "opp") paintOpp();
        }
        if (d.t === "team") {
          const coach = COACHES.find(item => item.n === d.coach);
          if (!coach) {
            toast("وصلتنا بيانات مدرب غير معروفة من الخصم");
            return;
          }
          OPP = {
            avg: d.avg,
            baseAvg: d.baseAvg,
            names: d.names,
            name: "الخصم",
            formation: formationById(d.formation).id,
            slots: formationSlots(d.formation),
            coach
          };
          if (window.__showOpp) window.__showOpp();
        }
      });
      connection.on("close", () => handleOpponentDisconnect(connection));
      connection.on("error", () => {
        if (conn === connection) toast("مشكلة في الاتصال، بنحاول نتحقق من رجوع الخصم");
      });
      const go = () => {
        if (!isHost) {
          try { connection.send({ t: "hello", formation: selectedFormation }) }
          catch (e) { handleOpponentDisconnect(connection) }
        }
      };
      const onOpen = () => {
        if (conn !== connection) return;
        startNetMonitor(connection);
        go();
      };
      if (connection.open) onOpen(); else connection.on("open", onOpen);
    }

    /* ================= BOOT ================= */
    screenHome();
  </script>
