<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07130d">
  <meta name="description" content="GG">
  <title>GG</title>
  <link rel="icon" type="image/png" href="./Icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GG">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <script>
    (function () {
      var shown = false;
      function showError(detail) {
        if (shown) return;
        shown = true;
        console.error("GG runtime error:", detail);
        var app = document.getElementById("app");
        if (!app) return;
        if (app.childElementCount) {
          if (typeof window.toast === "function") window.toast("حصل خطأ غير متوقع، جرّب تحديث الصفحة");
          return;
        }
        app.innerHTML = '<div class="rows"><div class="row"><span class="n">حصل خطأ غير متوقع. حدّث الصفحة وجرّب تاني.</span></div></div>';
        var button = document.createElement("button");
        button.type = "button";
        button.className = "btn w mt";
        button.textContent = "تحديث الصفحة";
        button.onclick = function () { location.reload(); };
        app.appendChild(button);
      }
      window.addEventListener("error", function (event) {
        showError(event && event.error ? event.error.message : event && event.message);
      });
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event && event.reason;
        showError(reason && reason.message ? reason.message : reason);
      });
    })();
  </script>
</head>

<body>
  <div id="app" aria-live="polite"></div>
<script>
  var V = Math.floor(Date.now() / 3600000); // يتغير كل ساعة
  ["data/fut-data.js", "data/custom-players.js", "data/coach-art.js", "data/hi-cards.js",
   "js/01-data.js", "js/02-helpers.js", "js/03-state.js", "js/04-card-render.js",
   "js/05-screens.js", "js/06-game-flow.js", "js/07-game-end.js", "js/08-simulation.js",
   "js/09-ai-opponent.js", "js/10-network.js", "js/11-navigation-boot.js",
   "js/12-assets.js"].forEach(function (f) {
    document.write('<script src="./' + f + '?v=' + V + '"><\/script>');
  });
</script>
<script>
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (error) {
        console.warn("Service worker registration failed:", error);
      });
    });
  }
</script>
  
</body>

</html>
