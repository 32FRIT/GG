<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07130d">
  <meta name="description" content="GG">
  <title>GG</title>
  <link rel="icon" type="image/png" href="./Icon.png">
  <link rel="apple-touch-icon" href="./Icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    :root {
      --bg: #07130d;
      --bg2: #0a1a12;
      --card: #0f2619;
      --card2: #143322;
      --tx: #eef7f1;
      --mu: #8aa79a;
      --ac: #2ee08a;
      --ac-d: #0e6b46;
      --gold: #f5c451;
      --bad: #ff5d5d;
      --line: rgba(255, 255, 255, .09);
      --r: 16px;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: "Cairo", -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(70% 45% at 50% -8%, rgba(46, 224, 138, .16), transparent 70%),
        radial-gradient(60% 40% at 100% 100%, rgba(245, 196, 81, .07), transparent 70%),
        var(--bg);
    }

    #app {
      max-width: 520px;
      margin: 0 auto;
      padding: calc(14px + var(--sat)) calc(16px + var(--sar)) calc(28px + var(--sab)) calc(16px + var(--sal));
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation
    }

    button:focus-visible {
      outline: 2px solid var(--ac);
      outline-offset: 3px
    }

    h1,
    h2,
    h3,
    p {
      margin: 0
    }

    .mu {
      color: var(--mu)
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap
    }

    /* ---------- brand ---------- */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      flex: 0 0 auto;
      background: linear-gradient(150deg, #2ee08a, #0e6b46);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 17px;
      color: #04150d;
      letter-spacing: -.5px;
      box-shadow: 0 6px 18px rgba(46, 224, 138, .28);
    }

    .brand h1 {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -.3px;
      line-height: 1.1
    }

    .brand-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex: 1;
      min-width: 0
    }

    .brand-heading h1 {
      font-size: clamp(15px, 5.2vw, 20px);
      white-space: nowrap
    }

    .brand span {
      font-size: 12px;
      color: var(--mu);
      display: block;
      font-weight: 600
    }

    /* ---------- hero ---------- */
    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      padding: 22px 20px;
      background: linear-gradient(155deg, #123a26, #0b2016 60%, #0a1a12);
      border: 1px solid rgba(46, 224, 138, .22);
      margin-bottom: 18px;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset-inline-end: -40px;
      top: -40px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(46, 224, 138, .22), transparent 68%);
    }

    .hero h2 {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -.5px;
      position: relative
    }

    .hero p {
      font-size: 13.5px;
      color: var(--mu);
      margin-top: 8px;
      line-height: 1.7;
      position: relative;
      max-width: 30ch
    }

    .hero .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      position: relative;
      background: rgba(46, 224, 138, .13);
      color: var(--ac);
      border: 1px solid rgba(46, 224, 138, .3);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      position: relative;
      z-index: 1
    }

    .help-icon {
      display: grid;
      place-items: center;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid rgba(46, 224, 138, .4);
      border-radius: 50%;
      background: rgba(46, 224, 138, .12);
      color: var(--ac);
      font-size: 19px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      transition: transform .12s ease, background .15s ease
    }

    .help-icon:active {
      transform: scale(.92);
      background: rgba(46, 224, 138, .22)
    }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--ac);
      color: #04150d;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      min-height: 50px;
      transition: transform .12s ease, filter .12s ease;
      box-shadow: 0 6px 20px rgba(46, 224, 138, .22);
    }

    .btn:active {
      transform: scale(.975)
    }

    .btn:disabled {
      opacity: .4;
      box-shadow: none;
      cursor: not-allowed
    }

    .btn.g {
      background: transparent;
      color: var(--tx);
      border: 1.5px solid var(--line);
      box-shadow: none
    }

    .btn.g:active {
      background: rgba(255, 255, 255, .05)
    }

    .btn.sell {
      color: var(--bad);
      border: 1px solid rgba(255, 93, 93, .45);
      background: rgba(255, 93, 93, .08);
      box-shadow: none
    }

    .btn.w {
      width: 100%
    }

    .btn.sm {
      padding: 9px 14px;
      min-height: 40px;
      font-size: 13.5px;
      border-radius: 11px
    }

    .wallet-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 0 0 12px;
      padding: 10px 14px;
      border: 1px solid rgba(245, 196, 81, .3);
      border-radius: 13px;
      background: rgba(245, 196, 81, .08);
      color: var(--gold);
      font-weight: 800
    }

    .wallet-badge b {
      direction: ltr;
      font-variant-numeric: tabular-nums
    }

    .brand-wallet {
      flex: 0 0 auto;
      gap: 4px;
      margin: 0;
      padding: 6px 9px;
      font-size: 12px
    }

    .squad-topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px
    }

    .squad-topbar .wallet-badge {
      flex: 1;
      margin: 0
    }

    .squad-formation-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    .squad-formation-title .sec-title {
      min-width: 0;
      margin: 20px 0 10px
    }

    .squad-formation-title .btn {
      flex: 0 0 auto;
      padding: 7px 10px;
      font-size: 11px
    }

    .coach-management-row {
      display: flex;
      gap: 8px;
      margin-top: 8px
    }

    .coach-management-row #club-coach {
      flex: 1;
      min-width: 0;
      justify-content: flex-start;
      text-align: right
    }

    .coach-collection-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 6px
    }

    .coach-collection-actions .btn {
      padding-inline: 9px;
      font-size: 11px
    }

    /* ---------- mode cards ---------- */
    .mode {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      text-align: right;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 15px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: transform .12s ease, border-color .15s ease, background .15s ease;
    }

    .mode:active {
      transform: scale(.985);
      background: var(--card2)
    }

    .mode.primary {
      border-color: rgba(46, 224, 138, .4);
      background: linear-gradient(150deg, #123a26, #0d2418)
    }

    .mode .ic {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      background: rgba(46, 224, 138, .12);
      font-size: 20px;
    }

    .mode.primary .ic {
      background: rgba(46, 224, 138, .2)
    }

    .mode .tx {
      flex: 1;
      min-width: 0
    }

    .mode b {
      display: block;
      font-size: 15.5px;
      font-weight: 800;
      margin-bottom: 2px
    }

    .mode small {
      display: block;
      font-size: 12.5px;
      color: var(--mu);
      line-height: 1.5
    }

    .mode .arw {
      color: var(--mu);
      font-size: 18px;
      flex: 0 0 auto
    }

    /* ---------- header ---------- */
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px
    }

    .hdr .l {
      min-width: 0
    }

    .hdr .pos {
      font-size: 17px;
      font-weight: 900;
      display: block;
      line-height: 1.2
    }

    .hdr .cnt {
      font-size: 12px;
      color: var(--mu);
      font-weight: 600
    }

    .timer {
      flex: 0 0 auto;
      min-width: 56px;
      height: 44px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 19px;
      background: var(--card);
      border: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
      transition: color .2s, border-color .2s, background .2s;
    }

    .timer.warn {
      color: var(--bad);
      border-color: rgba(255, 93, 93, .45);
      background: rgba(255, 93, 93, .1)
    }

    .bar {
      height: 5px;
      background: rgba(255, 255, 255, .07);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px
    }

    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #2ee08a, #7ef0b8);
      border-radius: 99px;
      transition: width .2s linear
    }

    .bar i.warn {
      background: linear-gradient(90deg, #ff5d5d, #ff9a9a)
    }

    /* ---------- card grid ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(9px, 3vw, 14px)
    }

    .pick-grid {
      align-items: start;
      margin-inline: auto;
      width: 100%
    }

    .formation-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 18px
    }

    .formation-option {
      min-height: 60px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      text-align: center;
      cursor: pointer
    }

    .formation-option.active {
      border-color: var(--ac);
      background: rgba(46, 224, 138, .12);
      color: var(--ac)
    }

    .formation-option b {
      display: block;
      direction: ltr;
      font-size: 15px;
      font-weight: 900
    }

    .formation-option small {
      display: block;
      margin-top: 2px;
      color: var(--mu);
      font-size: 10.5px
    }

    .pitch {
      display: grid;
      position: relative;
      gap: clamp(6px, 2vw, 10px);
      padding: clamp(10px, 3vw, 16px) clamp(6px, 2vw, 12px);
      border: 1px solid rgba(46, 224, 138, .22);
      border-radius: 16px;
      overflow: hidden;
      background:
        linear-gradient(90deg, transparent 49.7%, rgba(255, 255, 255, .1) 49.7% 50.3%, transparent 50.3%),
        repeating-linear-gradient(0deg, #123a26 0 42px, #103321 42px 84px);
    }

    .squad-overall {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 66px;
      height: 42px;
      border: 1px solid rgba(245, 196, 81, .65);
      border-radius: 12px;
      background: rgba(7, 19, 13, .94);
      box-shadow: 0 5px 16px rgba(0, 0, 0, .35), 0 0 12px rgba(245, 196, 81, .16);
      color: var(--gold);
      direction: ltr
    }

    .squad-overall b {
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums
    }

    .squad-overall span {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .04em
    }

    .pitch-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      min-width: 0
    }

    .pitch-player {
      flex: 1 1 0;
      min-width: 0;
      max-width: 100px;
      padding: clamp(5px, 1.7vw, 8px) 2px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 10px;
      background: rgba(7, 19, 13, .84);
      text-align: center
    }

    .pitch-player.has-player-card {
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .pitch-player.has-player-card > .fc {
      width: 90%;
      margin-inline: auto
    }

    .pitch-player small {
      display: block;
      color: var(--ac);
      font-size: clamp(8px, 2.4vw, 10px);
      font-weight: 800
    }

    .pitch-player b {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      font-size: clamp(8px, 2.7vw, 11px);
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .squad-slot {
      color: var(--tx);
      font-family: inherit;
      cursor: pointer
    }

    .squad-slot.empty {
      border-style: dashed;
      border-color: rgba(46, 224, 138, .55);
      color: var(--ac)
    }

    .squad-slot.selected,
    .bench-slot.selected {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
      box-shadow: 0 0 16px rgba(245, 196, 81, .3)
    }

    .squad-action-panel {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid rgba(245, 196, 81, .3);
      border-radius: 14px;
      background: rgba(245, 196, 81, .08);
      animation: overlay-in .18s ease both
    }

    .squad-action-panel p {
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 700
    }

    .sale-breakdown {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 5px 12px;
      margin-bottom: 10px;
      color: var(--mu);
      font-size: 11px;
      font-weight: 700
    }

    .sale-breakdown b {
      color: var(--tx);
      font-variant-numeric: tabular-nums
    }

    .sale-breakdown .loss b {
      color: var(--bad)
    }

    .squad-action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .squad-action-buttons .btn {
      flex: 1 1 calc(50% - 8px);
      min-width: 0;
      padding-inline: 8px;
      font-size: 12px
    }

    .setup-confirmation {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid rgba(46, 224, 138, .35);
      border-radius: 12px;
      background: rgba(46, 224, 138, .06)
    }

    .setup-confirmation p,
    .setup-confirmation small {
      margin: 0;
      color: var(--mu);
      font-size: 11px
    }

    .setup-confirmation strong {
      color: var(--ac);
      font-variant-numeric: tabular-nums
    }

    .setup-confirmation small {
      color: var(--bad)
    }

    .bench-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: start;
      gap: 10px;
      margin-top: 10px
    }

    .bench-slot {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      min-width: 0;
      min-height: 52px;
      padding: 5px 3px;
      border: 1px dashed rgba(46, 224, 138, .45);
      border-radius: 9px;
      background: var(--card);
      color: var(--tx);
      cursor: pointer
    }

    .bench-slot small,
    .bench-slot b {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .bench-slot small {
      color: var(--mu);
      font-size: 9px
    }

    .bench-slot b {
      margin-top: 2px;
      color: var(--ac);
      font-size: 10px
    }

    .bench-slot.owned-slot {
      min-height: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer
    }

    .bench-slot.owned-slot small {
      font-size: 9px;
      text-align: center
    }

    .bench-slot .fc,
    .player-market-card .fc {
      width: 100%;
    }

    .bench-slot .fc {
      width: 90%;
      margin-inline: auto;
      pointer-events: none;
    }

    .market-filters {
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      margin-bottom: 12px
    }

    .market-filters .formation-option {
      min-height: 42px;
      padding: 4px 2px
    }

    .market-filters small {
      font-size: 10px;
      font-weight: 900
    }

    .market-search {
      width: 100%;
      margin-top: 12px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: var(--tx);
      font: inherit;
      font-size: 14px;
      text-align: start;
    }

    .market-search::placeholder {
      color: var(--mu);
      opacity: 1
    }

    .market-search:focus {
      outline: none;
      border-color: var(--ac);
      box-shadow: 0 0 0 3px rgba(46, 224, 138, .12)
    }

    .market-search[hidden],
    [data-market-search-item][hidden],
    [data-market-empty][hidden] {
      display: none
    }

    .market-list {
      display: grid;
      gap: 8px;
      margin-top: 12px
    }

    .market-search-empty {
      grid-column: 1 / -1
    }

    .market-list.player-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .market-item.player-market-card {
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 8px;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .player-market-card .fc {
      width: 100%;
    }

    .player-market-card .market-price {
      width: 100%;
      max-width: none;
      margin-top: auto;
    }

    .player-market-card .market-item-price {
      padding: 4px 0;
      color: var(--gold);
      font-size: 10px;
      font-weight: 800;
      text-align: center
    }

    .market-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--card)
    }

    .market-item-info {
      min-width: 0;
      flex: 1;
    }

    .market-item-info b,
    .market-item-info small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .market-item-info small {
      margin-top: 2px;
      color: var(--mu);
      font-size: 11px
    }

    .owned-formation-row {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: stretch
    }

    .owned-formation-row .formation-option {
      margin: 0
    }

    .owned-formation-row > .btn {
      white-space: nowrap
    }

    .market-price {
      flex: 0 1 118px;
      min-width: 0;
      max-width: 118px;
      font-size: 11px;
      line-height: 1.2;
      white-space: normal;
      overflow-wrap: anywhere
    }

    .market-price.owned:disabled {
      opacity: 1;
      color: var(--ac);
      border-color: rgba(46, 224, 138, .4)
    }

    .rating-compare {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px
    }

    .coach-compare {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px
    }

    .coach-compare-item {
      min-width: 0;
      text-align: center
    }

    .coach-compare-title {
      min-height: 36px;
      margin-bottom: 6px;
      color: var(--mu);
      font-size: 11px;
      font-weight: 700
    }

    .coach-compare-item .fcwrap {
      width: 90px;
      max-width: 100%;
      margin: 0 auto
    }

    .rating-card {
      padding: 12px 8px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      text-align: center
    }

    .rating-card .label {
      color: var(--mu);
      font-size: 12px;
      font-weight: 700
    }

    .rating-card .value {
      margin-top: 2px;
      color: var(--ac);
      font-size: 32px;
      font-weight: 900;
      line-height: 1.2;
      font-variant-numeric: tabular-nums
    }

    .rating-card.opponent .value {
      color: var(--gold)
    }

    .rating-card small {
      display: block;
      margin-top: 3px;
      color: var(--mu);
      font-size: 10px
    }

    @media (min-width:430px) {
      .grid {
        gap: 15px
      }
    }

    /* ---------- football card ---------- */
    .fc {
      position: relative;
      container-type: inline-size;
      width: 100%;
      aspect-ratio: 3/4.05;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 7% 6% 6%;
      text-align: center;
      direction: ltr;
      clip-path: polygon(50% 0, 100% 6%, 100% 91%, 50% 100%, 0 91%, 0 6%);
      background: linear-gradient(160deg, var(--g1), var(--g2) 52%, var(--g1));
      color: var(--c1);
      user-select: none;
      border: 1px solid rgba(255, 255, 255, .24);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .32), inset 0 0 0 2px rgba(255, 255, 255, .07);
      transition: transform .16s ease, box-shadow .18s ease, filter .18s ease;
    }

    .fc::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg, rgba(255, 255, 255, .22) 0%, transparent 38%, transparent 62%, rgba(255, 255, 255, .1) 100%);
      mix-blend-mode: overlay;
    }

    .t-icon {
      --g1: #1a1206;
      --g2: #4a3409;
      --c1: #f7d97a
    }

    .t-elite {
      --g1: #08182f;
      --g2: #1d4f8c;
      --c1: #f7d97a
    }

    .t-gold {
      --g1: #8a6410;
      --g2: #eec95f;
      --c1: #2a1d00
    }

    .t-silver {
      --g1: #78838b;
      --g2: #e2eaef;
      --c1: #1d2429
    }

    .t-bronze {
      --g1: #74441f;
      --g2: #d99a63;
      --c1: #2a1608
    }

    .fc-top {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1;
      position: relative;
      z-index: 1
    }

    .fc-top b {
      font-size: 17cqw;
      font-weight: 900;
      letter-spacing: -.04em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .22)
    }

    .fc-top i {
      font-style: normal;
      font-size: 6.6cqw;
      font-weight: 800;
      opacity: .85;
      margin-top: .6cqw
    }

    .fc-era {
      position: absolute;
      top: 8cqw;
      inset-inline-end: 6cqw;
      z-index: 1;
      font-size: 5.2cqw;
      font-weight: 800;
      opacity: .8;
      letter-spacing: .02em;
      padding: 1.8cqw 3.4cqw;
      border: 1px solid currentColor;
      border-radius: 999px;
      background: rgba(0, 0, 0, .13);
    }

    .fc-mono {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 0;
      font-size: 52cqw;
      font-weight: 900;
      opacity: .13;
      line-height: 1;
      padding-top: 6cqw;
    }

    .fc-player-silhouette {
      position: absolute;
      left: 50%;
      bottom: 24%;
      width: 58%;
      height: 43%;
      transform: translateX(-50%);
      z-index: 0;
      color: var(--c1);
      opacity: .24;
    }

    .fc-player-silhouette::before,
    .fc-player-silhouette::after {
      content: "";
      position: absolute;
      background: currentColor;
    }

    .fc-player-silhouette::before {
      top: 0;
      left: 37%;
      width: 26%;
      aspect-ratio: 1;
      border-radius: 50%;
    }

    .fc-player-silhouette::after {
      bottom: 0;
      left: 5%;
      width: 90%;
      height: 69%;
      border-radius: 46% 46% 8% 8%;
      clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%);
    }

    .fc-name {
      margin-top: auto;
      font-size: 9.4cqw;
      font-weight: 900;
      line-height: 1.15;
      direction: rtl;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      position: relative;
      z-index: 1;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .12);
    }

    .fc.squad-player-card .fc-name,
    .fc.bench-player-card .fc-name,
    .fc.formation-player-card .fc-name {
      font-size: 10.4cqw
    }

    .fc-rule {
      height: 1.5px;
      background: currentColor;
      opacity: .35;
      margin: 2.6cqw 4cqw 2.2cqw;
      position: relative;
      z-index: 1
    }

    .fc-meta {
      font-size: clamp(8px, 6.2cqw, 12px);
      font-weight: 700;
      line-height: 1.35;
      direction: rtl;
      opacity: .9;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      position: relative;
      z-index: 1
    }

    /* hidden / back card */
    .fc.back {
      background: repeating-linear-gradient(135deg, #0b1f16 0 9px, #0e271b 9px 18px);
      color: var(--ac);
      display: grid;
      place-items: center;
      border: 0;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(46, 224, 138, .18);
      transition: transform .14s ease, box-shadow .18s ease, filter .18s ease;
    }

    .fc.back span {
      font-size: 22cqw;
      font-weight: 900;
      letter-spacing: .06em;
      opacity: .9
    }

    .fc.back:active {
      transform: scale(.97);
      filter: brightness(1.2)
    }

    .fc.back:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
      z-index: 2
    }

    @media (hover:hover) {
      .fc.back:not(:disabled):hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 26px rgba(0, 0, 0, .42), inset 0 0 0 1px rgba(46, 224, 138, .4)
      }
    }

    .fc.back.used {
      opacity: .28;
      pointer-events: none
    }

    .fc.back.used span {
      font-size: 9cqw
    }

    /* selection states */
    .fc.pick {
      animation: pop .32s cubic-bezier(.2, 1.3, .4, 1) both
    }

    @keyframes pop {
      from {
        transform: scale(.9);
        opacity: .4
      }

      to {
        transform: scale(1);
        opacity: 1
      }
    }

    .fc.dim {
      opacity: .32;
      filter: saturate(.4)
    }

    .fc.win {
      box-shadow: 0 0 0 2px #2ee08a, 0 10px 26px rgba(46, 224, 138, .28), inset 0 0 0 2px rgba(255, 255, 255, .09)
    }

    .fc.lose {
      box-shadow: 0 0 0 2px #ff5d5d, 0 10px 26px rgba(255, 93, 93, .23), inset 0 0 0 2px rgba(255, 255, 255, .08)
    }

    .badge {
      position: absolute;
      top: -7px;
      inset-inline-end: -7px;
      z-index: 3;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 900;
      color: #04150d;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .4);
    }

    .badge.ok {
      background: #2ee08a
    }

    .badge.no {
      background: #ff5d5d;
      color: #fff
    }

    .fcwrap {
      position: relative;
      min-width: 0;
      filter: drop-shadow(0 5px 8px rgba(0, 0, 0, .2))
    }

    .pick-actions {
      display: grid;
      gap: 9px;
      margin-top: 16px
    }

    .pick-actions .btn {
      width: 100%;
      min-height: 52px
    }

    .pick-stage {
      position: relative;
      isolation: isolate
    }

    .pick-stage-grid {
      filter: blur(2px);
      opacity: .3;
      transform: scale(.97);
      transition: filter .2s ease, opacity .2s ease, transform .2s ease;
      pointer-events: none
    }

    .pick-card-stack {
      position: relative;
      isolation: isolate;
      width: min(100%, 260px, 42dvh);
      aspect-ratio: 3/4.05;
      margin-inline: auto
    }

    .pick-card-stack .stack-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      filter: blur(1.4px);
      opacity: .72;
      transform-origin: center 85%;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .48)
    }

    .pick-card-stack .stack-back:nth-child(1) {
      z-index: 1;
      transform: rotate(-8deg) translateX(-15px) scale(.96)
    }

    .pick-card-stack .stack-back:nth-child(2) {
      z-index: 2;
      transform: rotate(-3deg) translateY(-4px) scale(.98)
    }

    .pick-card-stack .stack-back:nth-child(3) {
      z-index: 3;
      transform: rotate(8deg) translateX(15px) scale(.96)
    }

    .pick-card-front {
      position: absolute;
      inset: 0;
      z-index: 4;
      filter: drop-shadow(0 12px 20px rgba(0, 0, 0, .48))
    }

    .pick-card-front .fc {
      height: 100%
    }

    .pick-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: calc(18px + var(--sat)) calc(18px + var(--sar)) calc(18px + var(--sab)) calc(18px + var(--sal));
      overflow-y: auto;
      background: rgba(2, 10, 6, .62);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      animation: overlay-in .18s ease both
    }

    .pick-dialog {
      width: min(100%, 340px);
      max-height: calc(100dvh - 36px - var(--sat) - var(--sab));
      overflow-y: auto;
      overflow-x: clip;
      padding: clamp(14px, 4vw, 20px);
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 22px;
      background: linear-gradient(160deg, rgba(17, 43, 29, .97), rgba(7, 19, 13, .98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .58), 0 0 36px rgba(46, 224, 138, .09);
      text-align: center;
      animation: card-zoom-in .32s cubic-bezier(.2, 1.15, .35, 1) both
    }

    .pick-dialog-title {
      margin-bottom: 12px;
      color: var(--mu);
      font-size: 13px;
      font-weight: 700
    }

    .pick-dialog .pick-actions {
      margin-top: 16px
    }

    @keyframes overlay-in {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes card-zoom-in {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.72)
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }

    /* ---------- squad strip ---------- */
    .squad {
      margin-top: 18px
    }

    .squad .lbl {
      font-size: 11.5px;
      color: var(--mu);
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between
    }

    .slots {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none
    }

    .slots::-webkit-scrollbar {
      display: none
    }

    .slot {
      flex: 0 0 auto;
      min-width: 52px;
      height: 34px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 10.5px;
      font-weight: 700;
      background: rgba(255, 255, 255, .04);
      border: 1px dashed rgba(255, 255, 255, .12);
      color: var(--mu);
      padding: 0 8px;
      white-space: nowrap;
    }

    .slot.on {
      background: rgba(46, 224, 138, .13);
      border: 1px solid rgba(46, 224, 138, .35);
      color: var(--ac)
    }

    .slot.now {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(245, 196, 81, .1)
    }

    /* ---------- reveal / opp ---------- */
    .note {
      font-size: 13px;
      color: var(--mu);
      line-height: 1.7;
      margin: 14px 0 0;
      text-align: center
    }

    .note b {
      color: var(--tx)
    }

    .sec-title {
      font-size: 15px;
      font-weight: 800;
      margin: 20px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .sec-title::before {
      content: "";
      width: 3px;
      height: 15px;
      border-radius: 2px;
      background: var(--ac)
    }

    /* ---------- result ---------- */
    .score {
      font-size: clamp(46px, 15vw, 64px);
      font-weight: 900;
      line-height: 1;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
    }

    .verdict {
      font-size: 19px;
      font-weight: 900;
      margin-top: 6px
    }

    .rows {
      margin-top: 16px;
      border-radius: var(--r);
      overflow: hidden;
      border: 1px solid var(--line)
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      font-size: 13.5px
    }

    .row:last-child {
      border-bottom: 0
    }

    .row .r {
      color: var(--mu);
      font-size: 12px;
      font-weight: 700;
      flex: 0 0 auto
    }

    .row .n {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .row .v {
      font-weight: 900;
      color: var(--ac);
      flex: 0 0 auto;
      font-variant-numeric: tabular-nums
    }

    /* ---------- misc ---------- */
    .input {
      width: 100%;
      padding: 14px;
      border-radius: 13px;
      border: 1.5px solid var(--line);
      background: var(--card);
      color: var(--tx);
      font: inherit;
      font-size: 20px;
      text-align: center;
      letter-spacing: .3em;
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 12px;
    }

    .input::placeholder {
      letter-spacing: normal;
      font-size: 14px;
      font-weight: 600;
      color: var(--mu);
      text-transform: none
    }

    .input:focus {
      outline: none;
      border-color: var(--ac)
    }

    .toast {
      position: fixed;
      inset-inline: 0;
      bottom: calc(22px + var(--sab));
      z-index: 99;
      display: flex;
      justify-content: center;
      pointer-events: none;
      padding: 0 16px;
    }

    .toast i {
      background: #eef7f1;
      color: #07130d;
      padding: 10px 18px;
      border-radius: 12px;
      font-style: normal;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
      animation: tin .22s ease both;
      max-width: 100%;
      text-align: center;
    }

    @keyframes tin {
      from {
        transform: translateY(10px);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .spin {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      margin: 0 auto 16px;
      border: 3px solid rgba(46, 224, 138, .2);
      border-top-color: var(--ac);
      animation: sp .8s linear infinite;
    }

    @keyframes sp {
      to {
        transform: rotate(360deg)
      }
    }

    .center {
      text-align: center
    }

    .mt {
      margin-top: 16px
    }

    .mt-s {
      margin-top: 10px
    }

    .foot {
      margin-top: auto;
      padding-top: 22px;
      text-align: center;
      font-size: 11px;
      color: var(--mu);
      opacity: .7
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important
      }
    }

    @media (max-width:390px) {
      #app {
        padding-inline: calc(8px + var(--sar)) calc(8px + var(--sal))
      }

      .fc {
        border-radius: 12px
      }

      .pitch {
        padding-inline: 3px
      }

      .pitch-row {
        gap: 2px
      }

      .pitch-player.has-player-card > .fc,
      .bench-slot .fc {
        width: 100%
      }

      .fc.squad-player-card .fc-era,
      .fc.squad-player-card .fc-rule,
      .fc.squad-player-card .fc-meta,
      .fc.bench-player-card .fc-era,
      .fc.bench-player-card .fc-rule,
      .fc.bench-player-card .fc-meta,
      .fc.formation-player-card .fc-era,
      .fc.formation-player-card .fc-rule,
      .fc.formation-player-card .fc-meta {
        display: none
      }

      .fc.squad-player-card .fc-top i,
      .fc.bench-player-card .fc-top i,
      .fc.formation-player-card .fc-top i {
        font-size: 7px
      }

      .fc.squad-player-card .fc-name,
      .fc.bench-player-card .fc-name,
      .fc.formation-player-card .fc-name {
        font-size: clamp(8px, 13cqw, 10px)
      }

      .coach-compare {
        gap: 7px
      }

      .coach-compare-title {
        font-size: 10px
      }

      .pitch-row {
        gap: 4px
      }

      .pick-overlay {
        padding-inline: calc(14px + var(--sar)) calc(14px + var(--sal))
      }

      .pick-dialog {
        border-radius: 18px
      }
    }
  </style>
</head>

<body>
  <div id="app" aria-live="polite"></div>
  <script src="./fut-data.js"></script>
  <script>
    /* ================= DATA ================= */
    const P = FUT_DATA.players.map(player => ({
      n: player.n,
      p: player.p,
      nat: player.nat,
      club: player.club,
      era: player.era,
      r: player.r,
      price: player.price,
      suggestedPrice: player.suggestedPrice,
      rarity: player.rarity,
      isIcon: player.isIcon,
      eaId: player.eaId
    }));
    if (P.length !== 500 || P.some(player => player.r < 80 || !player.p)) {
      throw new Error('The imported player catalog must contain 500 players rated 80 or higher.');
    }
    if (P.some(player => player.price === null &&
      (!Number.isSafeInteger(player.suggestedPrice) || player.suggestedPrice <= 0))) {
      throw new Error('Every player without a market price must have a suggested price.');
    }
    const COACHES = FUT_DATA.coaches.map(coach => ({
      n: coach.n,
      tier: coach.tier,
      r: coach.r,
      quality: coach.quality,
      nation: coach.nat,
      league: coach.league,
      club: coach.club,
      price: coach.price,
      suggestedPrice: coach.suggestedPrice
    }));
    if (COACHES.length !== 513) throw new Error('The imported manager catalog must contain 513 managers.');
    if (COACHES.some(coach => coach.price === null &&
      (!Number.isSafeInteger(coach.suggestedPrice) || coach.suggestedPrice <= 0))) {
      throw new Error('Every manager without a market price must have a suggested price.');
    }
    const COACH_TIER = {
      legendary: { name: "أسطوري", color: "var(--gold)" },
      regular: { name: "عادي", color: "var(--ac)" },
      weak: { name: "ضعيف", color: "var(--bad)" }
    };
    const coachMultiplier = coach => 1 + (coach.r - 80) * 0.005;
    const coachAdjustedPower = (base, coach) => Math.min(99, Math.max(1, Math.round(base * coachMultiplier(coach))));
    function mkCoachPool() {
      const pool = [
        shuffle(COACHES.filter(c => c.tier === "legendary"))[0],
        shuffle(COACHES.filter(c => c.tier === "regular"))[0],
        shuffle(COACHES.filter(c => c.tier === "weak"))[0]
      ];
      shuffle(COACHES).forEach(coach => {
        if (pool.length < 4 && !pool.some(existing => existing.n === coach.n)) pool.push(coach);
      });
      return shuffle(pool);
    }
    const FORMATIONS = [
      { id: "4-3-3", name: "هجوم متوازن", lines: [["F", 3], ["M", 3], ["D", 4], ["G", 1]] },
      { id: "4-4-2", name: "توازن كلاسيكي", lines: [["F", 2], ["M", 4], ["D", 4], ["G", 1]] },
      { id: "4-2-3-1", name: "وسط وصانع لعب", lines: [["F", 1], ["M", 3], ["M", 2], ["D", 4], ["G", 1]] },
      { id: "3-5-2", name: "سيطرة وسط", lines: [["F", 2], ["M", 5], ["D", 3], ["G", 1]] },
      { id: "3-4-3", name: "ضغط هجومي", lines: [["F", 3], ["M", 4], ["D", 3], ["G", 1]] },
      { id: "4-1-4-1", name: "ارتكاز وأجنحة", lines: [["F", 1], ["M", 4], ["M", 1], ["D", 4], ["G", 1]] },
      { id: "4-5-1", name: "كتلة وسطية", lines: [["F", 1], ["M", 5], ["D", 4], ["G", 1]] },
      { id: "5-3-2", name: "دفاع وهجمات مرتدة", lines: [["F", 2], ["M", 3], ["D", 5], ["G", 1]] },
      { id: "5-4-1", name: "دفاع محكم", lines: [["F", 1], ["M", 4], ["D", 5], ["G", 1]] },
      { id: "3-4-2-1", name: "ثلاثي خلف المهاجم", lines: [["F", 1], ["M", 2], ["M", 4], ["D", 3], ["G", 1]] }
    ];

      if (!table || typeof table !== "object" || Array.isArray(table)) return false;
      const entries = Object.entries(table);
      return entries.length === keys.length &&

        entries.every(([key, value]) => keys.includes(key) && Number.isSafeInteger(value) && value >= 0);
    }

    function validClub(club) {
      if (club === null) return true;
      if (!club || !FORMATIONS.some(formation => formation.id === club.formation) ||
        typeof club.confirmed !== "boolean" ||
        !Array.isArray(club.ownedFormations) ||
        club.ownedFormations.some(id => !FORMATIONS.some(formation => formation.id === id)) ||
        new Set(club.ownedFormations).size !== club.ownedFormations.length ||
        !club.ownedFormations.includes(club.formation) ||
        !Array.isArray(club.starters) || club.starters.length !== 11 ||
        !Array.isArray(club.bench) || club.bench.length !== BENCH_SLOT_POSITIONS.length ||
        !Array.isArray(club.coaches) ||
        club.coaches.some(name => !COACHES.some(coach => coach.n === name)) ||
        new Set(club.coaches).size !== club.coaches.length ||
        (club.coach !== null && (!club.coaches.includes(club.coach) ||
          !COACHES.some(coach => coach.n === club.coach)))) return false;

      const starters = formationSlots(club.formation);
      const names = [...club.starters, ...club.bench].filter(name => name !== null);
      const costs = club.assetCosts;
      if (names.some(name => !P.some(player => player.n === name)) ||
        new Set(names).size !== names.length ||
        !costs ||
        !validCostTable(costs.players, names) ||
        !validCostTable(costs.coaches, club.coaches) ||
        !validCostTable(costs.formations, club.ownedFormations)) return false;
      if (club.starters.some((name, index) => name !== null &&
        P.find(player => player.n === name).p !== starters[index])) return false;
      return club.bench.every((name, index) => name === null || BENCH_SLOT_POSITIONS[index] === null ||
        P.find(player => player.n === name).p === BENCH_SLOT_POSITIONS[index]);
    }

    function sanitizeSavedClub(club) {
      if (club === null) return null;
      if (!club || !FORMATIONS.some(formation => formation.id === club.formation) ||
        !Array.isArray(club.starters) || club.starters.length !== 11 ||
        !Array.isArray(club.bench) || club.bench.length !== BENCH_SLOT_POSITIONS.length) return null;

      const used = new Set();
      const keepPlayer = (name, requiredPosition) => {
        if (name === null) return null;
        const player = P.find(item => item.n === name);
        if (!player || (requiredPosition && player.p !== requiredPosition) || used.has(name)) return null;
        used.add(name);
        return name;
      };
      const positions = formationSlots(club.formation);
      const ownedFormations = Array.isArray(club.ownedFormations)
        ? [...new Set(club.ownedFormations.filter(id => FORMATIONS.some(formation => formation.id === id)))]
        : [];
      if (!ownedFormations.includes(club.formation)) ownedFormations.unshift(club.formation);
      const activeCoach = COACHES.some(coach => coach.n === club.coach) ? club.coach : null;
      const coaches = Array.isArray(club.coaches)
        ? [...new Set(club.coaches.filter(name => COACHES.some(coach => coach.n === name)))]
        : [];
      if (activeCoach && !coaches.includes(activeCoach)) coaches.unshift(activeCoach);
      const starters = club.starters.map((name, index) => keepPlayer(name, positions[index]));
      const bench = club.bench.map((name, index) => keepPlayer(name, BENCH_SLOT_POSITIONS[index]));
      const playerNames = [...starters, ...bench].filter(name => name !== null);
      const savedCosts = club.assetCosts || {};
      const costsFor = (table, keys, fallback) => Object.fromEntries(keys.map(key => {
        const savedCost = table && table[key];
        const defaultCost = fallback(key);
        return [key, Number.isSafeInteger(savedCost) && savedCost >= 0
          ? savedCost
          : Number.isSafeInteger(defaultCost) && defaultCost >= 0 ? defaultCost : 0];
      }));
      const sanitized = {
        formation: club.formation,
        confirmed: typeof club.confirmed === "boolean" ? club.confirmed : true,
        ownedFormations,
        starters,
        bench,
        coaches,
        coach: activeCoach,
        assetCosts: {
          players: costsFor(savedCosts.players, playerNames, name => P.find(player => player.n === name).price),
          coaches: costsFor(savedCosts.coaches, coaches, name => coachPrice(COACHES.find(coach => coach.n === name))),
          formations: costsFor(savedCosts.formations, ownedFormations,
            id => id === ownedFormations[0] ? 0 : FORMATION_PRICE)
        }
      };
      return validClub(sanitized) ? sanitized : null;

    function recordGuestMatch(match, goalsFor, goalsAgainst) {
      const win = goalsFor > goalsAgainst;
      const draw = goalsFor === goalsAgainst;
      if (match.entry === "club" && match.mode === "ai") {
        const reward = win ? CLUB_CPU_REWARDS.win : draw ? CLUB_CPU_REWARDS.draw : 0;
        if (!reward) return;
        const previousCoins = guestProgress.coins;
        guestProgress.coins = Math.min(Number.MAX_SAFE_INTEGER, previousCoins + reward);
        if (!saveGuestProgress()) guestProgress.coins = previousCoins;
        else toast(`مكافأة الكمبيوتر: +${(guestProgress.coins - previousCoins).toLocaleString("en-US")} 🪙`);
        return;
      }
      if (match.mode !== "online") return;

      const reward = win ? MATCH_REWARDS.win : draw ? MATCH_REWARDS.draw : MATCH_REWARDS.loss;
      const previousCoins = guestProgress.coins;
      const previousRecord = { ...guestProgress.record };
      const previousTeam = guestProgress.lastTeam;
      guestProgress.coins = Math.min(Number.MAX_SAFE_INTEGER, guestProgress.coins + reward);
      guestProgress.record.played++;
      if (win) guestProgress.record.wins++;
      else if (draw) guestProgress.record.draws++;
      else guestProgress.record.losses++;
      guestProgress.record.bestRating = Math.max(guestProgress.record.bestRating, match.avg);
      guestProgress.lastTeam = {

        formation: match.formation,
        coach: match.coach.n,

      if (!saveGuestProgress()) {

        g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + (dur || .12));
        o.connect(g); g.connect(AC.destination);

    function arrangeClubForFormation(club, formationId) {
      const inventory = [...club.starters, ...club.bench]
        .filter(Boolean)
        .map(name => P.find(player => player.n === name))
        .filter(Boolean);
      const remaining = new Set(inventory.map(player => player.n));
      const takePlayer = position => {
        const player = inventory.find(item => remaining.has(item.n) && item.p === position);
        if (!player) return null;
        remaining.delete(player.n);
        return player.n;
      };
      const starters = formationSlots(formationId).map(takePlayer);
      const bench = Array(BENCH_SLOT_POSITIONS.length).fill(null);

      BENCH_SLOT_POSITIONS.forEach((position, index) => {
        if (position) bench[index] = takePlayer(position);
      });
      BENCH_SLOT_POSITIONS.forEach((position, index) => {
        if (position === null) bench[index] = takeAnyPlayer();
      });

      function takeAnyPlayer() {
        const player = inventory.find(item => remaining.has(item.n));
        if (!player) return null;
        remaining.delete(player.n);
        return player.n;
      }

      return { starters, bench };
    }

      const club = guestProgress.club;
      if (!club || !club.ownedFormations.includes(formationId)) {
        return toast("التشكيلة دي مش مملوكة");

      if (club.formation === formationId) return screenMyTeam();

      const previous = snapshotClubProgress();
      const lineup = arrangeClubForFormation(club, formationId);
      club.formation = formationId;
      club.starters = lineup.starters;
      club.bench = lineup.bench;
      selectedSquadSlot = null;
      showBench = false;
      if (!commitClubProgress(previous)) return screenMyTeam();
      toast(`تم تغيير التشكيلة إلى ${formationId}`);
      screenMyTeam();
    }

    function returnOwnedClubFormation(formationId) {
      const club = guestProgress.club;
      if (!club || !club.ownedFormations.includes(formationId)) return toast("التشكيلة غير موجودة");
      if (club.formation === formationId) return toast("غيّر خطتك الحالية الأول قبل إرجاعها");
      if (club.ownedFormations.length <= 1) return toast("لازم تفضل عندك تشكيلة واحدة على الأقل");
      const refund = club.assetCosts.formations[formationId];
      if (!Number.isSafeInteger(refund) || refund < 0) return toast("قيمة استرداد الخطة غير متاحة");
      if (!club.confirmed && refund === 0) return toast("الخطة الأولى المجانية تفضل متاحة لحد التأكيد");
      if (club.confirmed && guestProgress.coins > Number.MAX_SAFE_INTEGER - refund) {
        return toast("رصيدك وصل للحد الأقصى للكوينز");
      }

      const previous = snapshotClubProgress();
      club.ownedFormations = club.ownedFormations.filter(id => id !== formationId);
      delete club.assetCosts.formations[formationId];
      if (club.confirmed) guestProgress.coins += refund;
      if (!commitClubProgress(previous)) return screenOwnedClubFormations();
      toast(club.confirmed
        ? `تم إرجاع الخطة · استرداد ${formatCoins(refund)} 🪙`
        : "تمت إزالة الخطة قبل التأكيد بدون خصم");
      screenOwnedClubFormations();
    }

    function selectDraftFreeFormation(formationId) {
      const club = guestProgress.club;
      if (!club || club.confirmed) return toast("اختيار الخطة المجاني متاح قبل التأكيد فقط");
      if (club.ownedFormations.includes(formationId)) return switchClubFormation(formationId);
      const freeIndex = club.ownedFormations.findIndex(id => club.assetCosts.formations[id] === 0);
      if (freeIndex === -1) return toast("الخطة المجانية غير موجودة");

      const previous = snapshotClubProgress();
      const oldFreeFormation = club.ownedFormations[freeIndex];
      club.ownedFormations[freeIndex] = formationId;
      delete club.assetCosts.formations[oldFreeFormation];
      club.assetCosts.formations[formationId] = 0;
      const lineup = arrangeClubForFormation(club, formationId);
      club.formation = formationId;
      club.starters = lineup.starters;
      club.bench = lineup.bench;
      selectedSquadSlot = null;
      showBench = false;
      if (!commitClubProgress(previous)) return screenOwnedClubFormations();
      toast(`تم تغيير الخطة مجانًا قبل التأكيد إلى ${formationId}`);
      screenMyTeam();
    }

      if (!club) return screenClubFormations();
      const draft = !club.confirmed;
      const freeFormationId = draft

      const baseRating = starters.length
        ? Math.round(starters.reduce((sum, player) => sum + player.r, 0) / starters.length)
        : null;
      const overall = baseRating === null
        ? null
        : coach ? coachAdjustedPower(baseRating, coach) : baseRating;
      const ratingDetails = `${starters.length}/11 لاعبين · ${coach ? `مدرب ${coach.n}` : "بدون مدرب"}`;
      const offsets = {
        G: 0,
        D: 1,
        M: 1 + slots.filter(position => position === "D").length,
        F: 1 + slots.filter(position => position === "D").length + slots.filter(position => position === "M").length
      };
      const used = { G: 0, D: 0, M: 0, F: 0 };
      const rows = formation.lines.map(([position, count]) => {
        const players = Array.from({ length: count }, () => {
          const index = offsets[position] + used[position]++;
          const name = club.starters[index];

    function squadSlotPosition(slot) {
      return slot.area === "starter"
        ? formationSlots(guestProgress.club.formation)[slot.index]
        : BENCH_SLOT_POSITIONS[slot.index];
    }

    function canPlayerUseSlot(playerName, slot) {
      const requiredPosition = squadSlotPosition(slot);
      const player = P.find(item => item.n === playerName);
      return !!player && (!requiredPosition || player.p === requiredPosition);
    }

    function firstEmptySquadSlot(area, playerName) {
      const slots = area === "starter"
        ? formationSlots(guestProgress.club.formation)
        : BENCH_SLOT_POSITIONS;
      const occupied = guestProgress.club[area === "starter" ? "starters" : "bench"];
      const player = P.find(item => item.n === playerName);
      if (!player) return null;
      let index = slots.findIndex((position, i) =>
        position === player.p && occupied[i] === null);
      if (index === -1 && area === "bench") {
        index = slots.findIndex((position, i) => position === null && occupied[i] === null);
      }
      return index === -1 ? null : { area, index };
    }

    function moveSelectedSquadPlayer(target) {
      if (!selectedSquadSlot || !target) return;
      const source = selectedSquadSlot;
      if (source.area === target.area && source.index === target.index) {
        selectedSquadSlot = null;
        return screenMyTeam();
      }
      const sourceName = squadSlotPlayer(source);
      const targetName = squadSlotPlayer(target);
      if (!sourceName || !canPlayerUseSlot(sourceName, target) ||
        (targetName && !canPlayerUseSlot(targetName, source))) {
        toast("المركز غير مناسب للاعب");
        return;
      }

      const sourceKey = source.area === "starter" ? "starters" : "bench";
      const targetKey = target.area === "starter" ? "starters" : "bench";
      guestProgress.club[targetKey][target.index] = sourceName;
      guestProgress.club[sourceKey][source.index] = targetName || null;
      selectedSquadSlot = null;
      showBench = source.area === "bench" || target.area === "bench";
      saveGuestProgress();
      toast(targetName ? "تم تبديل اللاعبين" : "تم نقل اللاعب");
      screenMyTeam();

    function handleSquadSlotTap(area, index, position) {
      const target = { area, index };
      if (!selectedSquadSlot) {
        if (squadSlotPlayer(target)) {
          selectedSquadSlot = target;
          if (area === "bench") showBench = true;
          return screenMyTeam();
        }
        if (area === "starter" && reservePlayersForSlot(target).length) {
          return screenReserveChoices(target);
        }
        openMarket(position || "ANY", {
          kind: "player",
          area,
          index,
          position: position || null
        }, "team");
        return;

      moveSelectedSquadPlayer(target);

      if (!selectedSquadSlot) return;
      const destination = selectedSquadSlot.area === "starter" ? "bench" : "starter";
      const playerName = squadSlotPlayer(selectedSquadSlot);
      const target = firstEmptySquadSlot(destination, playerName);
      if (!target) return toast("مفيش مكان مناسب وفاضي");
      moveSelectedSquadPlayer(target);

    function findPlayerSlot(player, target) {
      const club = guestProgress.club;
      if (!club) return null;
      const positions = formationSlots(club.formation);
      if (target && target.kind === "player") {
        const key = target.area === "starter" ? "starters" : "bench";
        const slots = club[key];
        const index = target.index;
        const replacing = target.replaceName && slots[index] === target.replaceName;
        if (!Number.isInteger(index) || index < 0 || index >= slots.length ||
          (slots[index] !== null && !replacing)) return null;
        const required = key === "starters" ? positions[index] : BENCH_SLOT_POSITIONS[index];
        if (required && required !== player.p) return null;
        return { key, index };
      }

      const starterIndex = positions.findIndex((position, index) =>
        position === player.p && club.starters[index] === null);
      if (starterIndex !== -1) return { key: "starters", index: starterIndex };
      const reserveIndex = BENCH_SLOT_POSITIONS.findIndex((position, index) =>
        position === player.p && club.bench[index] === null);
      if (reserveIndex !== -1) return { key: "bench", index: reserveIndex };
      const flexibleIndex = BENCH_SLOT_POSITIONS.findIndex((position, index) =>
        position === null && club.bench[index] === null);
      return flexibleIndex === -1 ? null : { key: "bench", index: flexibleIndex };
    }

    function buyMarketPlayer(player) {
      const club = guestProgress.club;
      const ownedPlayers = club ? [...club.starters, ...club.bench].filter(Boolean) : [];
      if (!Number.isSafeInteger(player.price) || player.price <= 0) return toast("سعر اللاعب محتاج تحديد");
      if (ownedPlayers.includes(player.n)) return toast("اللاعب مملوك بالفعل");
      const slot = findPlayerSlot(player, marketContext.target);
      if (!slot) return toast("مفيش مكان متاح للاعب في تشكيلتك");
      const target = marketContext.target;
      const oldName = target && target.replaceName;
      const oldCost = oldName && club.assetCosts.players[oldName];
      if (oldName && (!Number.isSafeInteger(oldCost) || oldCost < 0 ||
        club[target.area === "starter" ? "starters" : "bench"][target.index] !== oldName)) {
        return toast("اللاعب المحدد للتبديل لم يعد في مكانه");
      }
      const previous = snapshotClubProgress();
      let swapDifference = null;
      if (club.confirmed) {
        const available = guestProgress.coins + (oldCost || 0);
        if (!Number.isSafeInteger(available) || available < player.price) {
          return toast("رصيد الكوينز غير كافٍ لتبديل اللاعب");
        }
        const nextCoins = available - player.price;
        if (!Number.isSafeInteger(nextCoins)) return toast("رصيد الكوينز غير صالح");
        guestProgress.coins = nextCoins;
      }
      if (oldName) swapDifference = player.price - oldCost;
      if (oldName) delete club.assetCosts.players[oldName];
      club[slot.key][slot.index] = player.n;
      club.assetCosts.players[player.n] = player.price;
      if (slot.key === "bench") showBench = true;
      if (!commitClubProgress(previous)) return screenMarket();
      toast(oldName
        ? !club.confirmed ? "تم تبديل اللاعب مجانًا قبل التأكيد"
          : swapDifference < 0
            ? `تم تبديل اللاعب · استرداد ${formatCoins(-swapDifference)} 🪙`
            : `تم تبديل اللاعب · خصم ${formatCoins(swapDifference)} 🪙`
        : club.confirmed
          ? `تم شراء ${player.n} · ${formatCoins(player.price)} 🪙`
          : `تمت إضافة ${player.n} · السعر عند التأكيد ${formatCoins(player.price)} 🪙`);
      screenMyTeam();
    }

    function buyMarketCoach(coach) {
      const club = guestProgress.club;
      const price = coachPrice(coach);
      if (!club) return toast("اختار تشكيلتك الأول");
      if (!Number.isSafeInteger(price) || price <= 0) return toast("سعر المدرب محتاج تحديد");
      const target = marketContext.target;
      const oldName = target && target.replaceName;
      const oldCost = oldName ? club.assetCosts.coaches[oldName] : 0;
      let swapDifference = null;
      if (oldName) {
        if (!club.coaches.includes(oldName) || !Number.isSafeInteger(oldCost) || oldCost < 0) {
          return toast("المدرب المحدد للتبديل لم يعد في تشكيلتك");
        }
        if (club.coaches.includes(coach.n)) return toast("المدرب موجود بالفعل في مجموعتك");
        swapDifference = price - oldCost;
        if (club.confirmed) {
          const available = guestProgress.coins + oldCost;
          if (!Number.isSafeInteger(available) || available < price) {
            return toast("رصيد الكوينز غير كافٍ لتبديل المدرب");
          }
        }
      } else {
        if (club.coaches.includes(coach.n)) return toast("المدرب مملوك بالفعل");
        if (club.confirmed && guestProgress.coins < price) return toast("رصيد الكوينز غير كافٍ");
      }
      const previous = snapshotClubProgress();
      if (club.confirmed) guestProgress.coins += oldCost - price;
      if (oldName) {
        club.coaches = club.coaches.filter(name => name !== oldName);
        delete club.assetCosts.coaches[oldName];
      }
      club.coaches.push(coach.n);
      club.assetCosts.coaches[coach.n] = price;
      if (oldName || !club.coach) club.coach = coach.n;
      if (!commitClubProgress(previous)) return screenMarket();
      toast(oldName
        ? !club.confirmed ? "تم تبديل المدرب مجانًا قبل التأكيد"
          : swapDifference < 0
            ? `تم تبديل المدرب · استرداد ${formatCoins(-swapDifference)} 🪙`
            : `تم تبديل المدرب · خصم ${formatCoins(swapDifference)} 🪙`
        : club.confirmed
          ? `تم شراء ${coach.n} · ${formatCoins(price)} 🪙`
          : `تمت إضافة ${coach.n} · السعر عند التأكيد ${formatCoins(price)} 🪙`);
      if (marketContext.returnTo === "coaches") screenClubCoaches();
      else screenMyTeam();
    }

    /* ================= GAME FLOW ================= */
    function startGame() {
      cancelGameTimers();
      S = { i: 0, team: [], used: new Set(), pool: [], shown: new Set(), sw: 1, phase: "pick", sel: null, formation: selectedFormation, slots: formationSlots(selectedFormation), coach: null, coachPool: [], coachShown: new Set(), coachSwap: 1, mode: conn && conn.open ? "online" : "ai" };
      round();

    function round() {
      clearInterval(advanceTimer);
      advanceTimer = null;
      clearTimeout(phaseTimeout);
      phaseTimeout = null;
      if (S.i >= 11) return startCoachDraft();
      S.pool = mkPool(S.slots[S.i], S.used);
      S.shown = new Set();
      S.sw = 1;
      S.phase = "pick";
      S.sel = null;
      tEnd = Date.now() + TM * 1000;
      drawPick();
      startTimer(TM, () => {
        if (S.phase !== "pick") return;
        const available = S.pool
          .map((x, k) => S.shown.has(x.n) ? null : k)
          .filter(k => k !== null);
        const k = S.sel != null && !S.shown.has(S.pool[S.sel].n)
          ? S.sel
          : available[Math.floor(Math.random() * available.length)];
        if (k != null) keepPick(k);
      });
    }

    function mkPool(pos, used) {
      const av = P.filter(x => x.p === pos && !used.has(x.n));
      const st = shuffle(av.filter(x => x.r >= 88));
      const md = shuffle(av.filter(x => x.r >= 75 && x.r < 88));
      const wk = shuffle(av.filter(x => x.r < 75));
      const pool = [st[0], md[0], wk[0], wk[1]].filter(Boolean);
      shuffle(av).forEach(x => { if (pool.length < 4 && !pool.includes(x)) pool.push(x) });
      return shuffle(pool);
    }

    function formationHTML(team, formationId, title) {
      const formation = formationById(formationId);
      const slots = formationSlots(formation.id);
      const offsets = { G: 0, D: 1, M: 1 + slots.filter(p => p === "D").length, F: 1 + slots.filter(p => p === "D").length + slots.filter(p => p === "M").length };
      const used = { G: 0, D: 0, M: 0, F: 0 };
      const rows = formation.lines.map(([pos, count]) => {
        const players = Array.from({ length: count }, () => {
          const index = offsets[pos] + used[pos]++;
          const player = team[index];
          return player
            ? `<div class="pitch-player has-player-card" aria-label="${esc(player.n)}">${cardHTML(player, "formation-player-card")}</div>`
            : `<div class="pitch-player"><small>${POS_SHORT[pos]}</small><b>—</b></div>`;
        }).join("");
        return `<div class="pitch-row">${players}</div>`;
      }).join("");
      return `<div class="sec-title">${esc(title)} · <b dir="ltr">${formation.id}</b></div><div class="pitch">${rows}</div>`;
    }

    function coachCardHTML(coach, cls) {

    /* ================= SIMULATION ================= */
    function rng32(s) {
      return () => {
        s |= 0; s = s + 0x6D2B79F5 | 0;
        let t = Math.imul(s ^ s >>> 15, 1 | s);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function hs(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) }
      return h >>> 0;
    }
    function pois(l, r) {
      const L = Math.exp(-l); let k = 0, p = 1;
      do { k++; p *= r() } while (p > L && k < 40);
      return k - 1;
    }
    function simulate(me, opp) {
      const key = x => x.names.join(",") + "|" + x.avg + "|" + x.formation + "|" + (x.coach ? x.coach.n : "");
      const seedOf = x => Number.isSafeInteger(x.seed) && x.seed >= 0 && x.seed < 0x100000000
        ? x.seed
        : null;
      const stableKey = x => `${key(x)}|${seedOf(x) === null ? "" : seedOf(x)}`;
      const mineFirst = stableKey(me) <= stableKey(opp);
      const A = mineFirst ? me : opp, B = mineFirst ? opp : me;
      const bothSeeded = seedOf(A) !== null && seedOf(B) !== null;
      const seedInput = bothSeeded
        ? `${stableKey(A)}#${stableKey(B)}`
        : `${key(A)}#${key(B)}`;
      const r = rng32(hs(seedInput));
      const d = A.avg - B.avg;
      let ga = pois(Math.max(.35, 1.35 + d * .11), r);
      let gb = pois(Math.max(.35, 1.35 - d * .11), r);
      const gap = Math.abs(d);
      const upsetChance = me.entry === "club" && me.mode === "online" && bothSeeded
        ? ONLINE_CLUB_UPSET_CHANCE[gap] || 0
        : 0;
      if (upsetChance > 0 && r() < upsetChance) {
        if (d > 0) gb = Math.max(gb, ga + 1);
        else ga = Math.max(ga, gb + 1);
      } else {
        if (d > 0 && ga <= gb) ga = gb + 1;
        if (d < 0 && gb <= ga) gb = ga + 1;
      }
      const pickScorer = x => {
        const slots = x.slots || formationSlots(x.formation);
        const w = x.names.map((n, k) => slots[k] === "F" ? 5 : slots[k] === "M" ? 2 : slots[k] === "D" ? 1 : 0);
        const total = w.reduce((s, v) => s + v, 0);
        if (!total) return x.names[0];
        let t = total * r(), k = 0;
        while (k < w.length - 1 && t >= w[k]) { t -= w[k]; k++ }
        return x.names[k];
      };
      const ev = [];
      for (let i = 0; i < ga; i++) ev.push({ m: 1 + Math.floor(r() * 90), s: "A", who: pickScorer(A) });
      for (let i = 0; i < gb; i++) ev.push({ m: 1 + Math.floor(r() * 90), s: "B", who: pickScorer(B) });
      ev.sort((x, y) => x.m - y.m);
      return { mine: mineFirst, ev };
    }

    /* ================= AI OPPONENT ================= */
    function aiTeam(formationId) {
      let sum = 0; const names = [], sws = [], pools = [], used = new Set();
      const slots = formationSlots(formationId);
      slots.forEach(p => {
        const c = mkPool(p, used);
        let i = 0;
        if (c[0] && c[0].r < 80 && c[1]) i = 1;
        const x = c[i] || c[0];
        sws.push(i ? c[0].n : null);
        pools.push(c.map(z => z.n));
        used.add(x.n);
        names.push(x.n);
        sum += x.r;
      });
      const baseAvg = Math.round(sum / 11);
      const coach = COACHES[Math.floor(Math.random() * COACHES.length)];
      return { avg: coachAdjustedPower(baseAvg, coach), baseAvg, names, sws, pools, name: "الكمبيوتر", formation: formationId, slots, coach };
    }

    function aiClubTeam(difficulty) {
      const formation = FORMATIONS[Math.floor(Math.random() * FORMATIONS.length)];
      const slots = formationSlots(formation.id);
      const used = new Set();
      const names = slots.map(position => {
        const available = P.filter(player => player.p === position && !used.has(player.n));
        const inRange = available.filter(player => player.r >= difficulty.min && player.r <= difficulty.max);
        const candidates = inRange.length
          ? inRange
          : available.slice().sort((a, b) =>
            Math.abs(a.r - difficulty.target) - Math.abs(b.r - difficulty.target)).slice(0, 10);
        if (!candidates.length) throw new Error(`No computer players available for position ${position}.`);
        const player = candidates[Math.floor(Math.random() * candidates.length)];
        used.add(player.n);
        return player.n;
      });
      const players = names.map(name => P.find(player => player.n === name));
      const baseAvg = Math.round(players.reduce((sum, player) => sum + player.r, 0) / players.length);
      const coachCandidates = COACHES.slice()
        .sort((a, b) => Math.abs(a.r - difficulty.coachTarget) - Math.abs(b.r - difficulty.coachTarget))
        .slice(0, 12);
      const coach = coachCandidates[Math.floor(Math.random() * coachCandidates.length)];
      return {
        avg: coachAdjustedPower(baseAvg, coach),
        baseAvg,
        names,
        name: `الكمبيوتر · ${difficulty.name}`,
        formation: formation.id,
        slots,
        coach
      };
    }

    /* ================= NETWORK (PeerJS) ================= */
    function killNet() {
      stopNetMonitor();
      stopTeamResultRetry();
      localTeamResult = null;
      try { conn && conn.close() } catch (e) { }
      try { peer && peer.destroy() } catch (e) { }
      conn = null; peer = null;
      activeRoomType = "draft";
    }
    function netFail(msg, returnScreen = screenModes) {
      killNet();
      toast(msg || "مشكلة في الاتصال");
      setTimeout(returnScreen, 600);
    }
    function roomPeerId(code, gameType) {
      return `${gameType === "club" ? "ggc-" : "ggf-"}${code}`;
    }
    function hostRoom(code, lobby, gameType = "draft") {
      resetOpponent();
      const returnScreen = gameType === "club" ? screenClubModes : screenModes;
      if (gameType === "club" && !getClubMatchSetup()) return;
      if (typeof Peer === "undefined") return netFail("مكتبة الاتصال لسه بتحمّل، جرّب تاني", returnScreen);
      killNet();
      activeRoomType = gameType;
      try { peer = new Peer(roomPeerId(code, gameType)) } catch (e) { return netFail(undefined, returnScreen) }
      peer.on("open", () => {
        if (lobby) screenWait("بندور على لاعب", "هنتوصل بأول لاعب متاح...", undefined, returnScreen);
        else screenWait("الغرفة جاهزة", "ابعت الكود لصاحبك", code, returnScreen);
      });
      peer.on("connection", c => {
        conn = c;
        link(true, gameType);
      });
      peer.on("error", e => {
        if (lobby && e && e.type === "unavailable-id") joinRoom(code, gameType);
        else netFail("مش قادر أفتح الغرفة", returnScreen);
      });
    }
    function joinRoom(code, gameType = "draft") {
      resetOpponent();
      const returnScreen = gameType === "club" ? screenClubModes : screenModes;
      if (gameType === "club" && !getClubMatchSetup()) return;
      if (typeof Peer === "undefined") return netFail("مكتبة الاتصال لسه بتحمّل، جرّب تاني", returnScreen);
      killNet();
      activeRoomType = gameType;
      screenWait("بندخل الغرفة", "بنوصل بصاحبك...", undefined, returnScreen);
      try { peer = new Peer() } catch (e) { return netFail(undefined, returnScreen) }
      peer.on("open", () => {
        conn = peer.connect(roomPeerId(code, gameType), { reliable: true });
        link(false, gameType);
      });
      peer.on("error", () => netFail("مفيش غرفة بالكود ده", returnScreen));
    }
    function link(isHost, gameType = "draft") {
      if (!conn) return;
      const connection = conn;
      const returnScreen = gameType === "club" ? screenClubModes : screenModes;
      connection.on("data", d => {
        if (!d || !d.t) return;
        lastNetMessage = Date.now();
        if (d.t === "ping") {
          try { connection.send({ t: "pong" }) }
          catch (e) { handleOpponentDisconnect(connection) }
          return;
        }
        if (d.t === "pong") return;
        if (d.t === "team_ack") {
          stopTeamResultRetry();
          return;
        }
        if (d.t === "mode_error") {
          netFail("نوع المباراة مختلف بين اللاعبين", returnScreen);
          return;
        }
        if (d.t === "resign") {
          cancelGameTimers();
          S = null;
          killNet();
          resetOpponent();
          toast("الخصم انسحب من المباراة");
          returnScreen();
          return;
        }
        if (d.t === "hello" && isHost) {
          const remoteGameType = d.gameType === "club" ? "club" : "draft";
          if (remoteGameType !== gameType) {
            try { connection.send({ t: "mode_error" }) }
            catch (e) { handleOpponentDisconnect(connection); return }
            return netFail("نوع المباراة مختلف بين اللاعبين", returnScreen);
          }
          const formation = FORMATIONS.find(item => item.id === d.formation);
          if (!formation) return netFail("خطة الخصم غير صالحة", returnScreen);
          opponentFormation = formation.id;
          if (gameType === "club") {
            try { connection.send({ t: "club-ready" }) }
            catch (e) { handleOpponentDisconnect(connection); return }
            return startClubMatch("online");
          }
          try { connection.send({ t: "cfg", tm: TM, formation: selectedFormation, gameType }) }
          catch (e) { handleOpponentDisconnect(connection); return }
          startGame();
        }
        if (d.t === "club-ready" && !isHost && gameType === "club") {
          return startClubMatch("online");
        }
        if (d.t === "cfg" && !isHost) {
          if (gameType !== "draft" || (d.gameType && d.gameType !== "draft")) {
            return netFail("نوع المباراة مختلف بين اللاعبين", returnScreen);
          }
          const formation = FORMATIONS.find(item => item.id === d.formation);
          if (!formation) return netFail("خطة الخصم غير صالحة", returnScreen);
          TM = d.tm || TM;
          opponentFormation = formation.id;
          startGame();
        }
        if (d.t === "pick") {
          OPPK[d.i] = d.n; OPPS[d.i] = d.s; OPPP[d.i] = d.p;
          if (S && S.phase === "opp") paintOpp();
        }
        if (d.t === "team") {
          const coach = COACHES.find(item => item.n === d.coach);
          const formation = FORMATIONS.find(item => item.id === d.formation);
          const team = Array.isArray(d.names) && d.names.length === 11
            ? d.names.map(name => P.find(player => player.n === name))
            : [];
          const slots = formation ? formationSlots(formation.id) : [];
          const validSeed = gameType !== "club" ||
            Number.isSafeInteger(d.seed) && d.seed >= 0 && d.seed < 0x100000000;
          const validTeam = !!coach && !!formation && team.length === 11 &&
            team.every((player, index) => player && player.p === slots[index]) &&
            new Set(d.names).size === 11 &&
            Number.isSafeInteger(d.avg) && d.avg >= 1 && d.avg <= 99 &&
            Number.isSafeInteger(d.baseAvg) && d.baseAvg >= 1 && d.baseAvg <= 99 &&
            validSeed;
          if (!validTeam) {
            toast("بيانات فريق الخصم غير مكتملة، مش قادرين نعرض النتيجة");
            return;
          }
          OPP = {
            avg: d.avg,
            baseAvg: d.baseAvg,
            names: d.names,
            name: "الخصم",
            formation: formation.id,
            slots,
            coach,
            seed: d.seed
          };
          try { connection.send({ t: "team_ack" }) }
          catch (e) { handleOpponentDisconnect(connection); return }
          if (window.__showOpp) window.__showOpp();
        }
      });
      connection.on("close", () => handleOpponentDisconnect(connection));
      connection.on("error", () => {
        if (conn === connection) toast("مشكلة في الاتصال، بنحاول نتحقق من رجوع الخصم");
      });
      const go = () => {
        if (!isHost) {
          const formation = gameType === "club" && guestProgress.club
            ? guestProgress.club.formation
            : selectedFormation;
          try { connection.send({ t: "hello", formation, gameType }) }
          catch (e) { handleOpponentDisconnect(connection) }
        }
      };
      const onOpen = () => {
        if (conn !== connection) return;
        startNetMonitor(connection);
        go();
      };
      if (connection.open) onOpen(); else connection.on("open", onOpen);
    }

    /* ================= BOOT ================= */
    screenHome();
  </script>
</body>
