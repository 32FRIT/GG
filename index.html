<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07130d">
  <meta name="description" content="GG">
  <title>GG</title>
  <link rel="icon" type="image/png" href="./Icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GG">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    :root {
      --bg: #07130d;
      --bg2: #0a1a12;
      --card: #0f2619;
      --card2: #143322;
      --tx: #eef7f1;
      --mu: #8aa79a;
      --ac: #2ee08a;
      --ac-d: #0e6b46;
      --gold: #f5c451;
      --bad: #ff5d5d;
      --line: rgba(255, 255, 255, .09);
      --r: 16px;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: "Cairo", -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(70% 45% at 50% -8%, rgba(46, 224, 138, .16), transparent 70%),
        radial-gradient(60% 40% at 100% 100%, rgba(245, 196, 81, .07), transparent 70%),
        var(--bg);
    }

    #app {
      max-width: 520px;
      margin: 0 auto;
      padding: calc(14px + var(--sat)) calc(16px + var(--sar)) calc(28px + var(--sab)) calc(16px + var(--sal));
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation
    }

    button:focus-visible {
      outline: 2px solid var(--ac);
      outline-offset: 3px
    }

    h1,
    h2,
    h3,
    p {
      margin: 0
    }

    .mu {
      color: var(--mu)
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap
    }

    /* ---------- brand ---------- */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      flex: 0 0 auto;
      background: linear-gradient(150deg, #2ee08a, #0e6b46);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 17px;
      color: #04150d;
      letter-spacing: -.5px;
      box-shadow: 0 6px 18px rgba(46, 224, 138, .28);
    }

    .brand h1 {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -.3px;
      line-height: 1.1
    }

    .brand-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex: 1;
      min-width: 0
    }

    .brand-heading h1 {
      font-size: clamp(15px, 5.2vw, 20px);
      white-space: nowrap
    }

    .brand span {
      font-size: 12px;
      color: var(--mu);
      display: block;
      font-weight: 600
    }

    /* ---------- hero ---------- */
    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      padding: 22px 20px;
      background: linear-gradient(155deg, #123a26, #0b2016 60%, #0a1a12);
      border: 1px solid rgba(46, 224, 138, .22);
      margin-bottom: 18px;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset-inline-end: -40px;
      top: -40px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(46, 224, 138, .22), transparent 68%);
    }

    .hero h2 {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -.5px;
      position: relative
    }

    .hero p {
      font-size: 13.5px;
      color: var(--mu);
      margin-top: 8px;
      line-height: 1.7;
      position: relative;
      max-width: 30ch
    }

    .hero .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      position: relative;
      background: rgba(46, 224, 138, .13);
      color: var(--ac);
      border: 1px solid rgba(46, 224, 138, .3);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      position: relative;
      z-index: 1
    }

    .help-icon {
      display: grid;
      place-items: center;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid rgba(46, 224, 138, .4);
      border-radius: 50%;
      background: rgba(46, 224, 138, .12);
      color: var(--ac);
      font-size: 19px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      transition: transform .12s ease, background .15s ease
    }

    .help-icon:active {
      transform: scale(.92);
      background: rgba(46, 224, 138, .22)
    }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--ac);
      color: #04150d;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      min-height: 50px;
      transition: transform .12s ease, filter .12s ease;
      box-shadow: 0 6px 20px rgba(46, 224, 138, .22);
    }

    .btn:active {
      transform: scale(.975)
    }

    .btn:disabled {
      opacity: .4;
      box-shadow: none;
      cursor: not-allowed
    }

    .btn.g {
      background: transparent;
      color: var(--tx);
      border: 1.5px solid var(--line);
      box-shadow: none
    }

    .btn.g:active {
      background: rgba(255, 255, 255, .05)
    }

    .btn.sell {
      color: var(--bad);
      border: 1px solid rgba(255, 93, 93, .45);
      background: rgba(255, 93, 93, .08);
      box-shadow: none
    }

    .btn.w {
      width: 100%
    }

    .btn.sm {
      padding: 9px 14px;
      min-height: 40px;
      font-size: 13.5px;
      border-radius: 11px
    }

    .wallet-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 0 0 12px;
      padding: 10px 14px;
      border: 1px solid rgba(245, 196, 81, .3);
      border-radius: 13px;
      background: rgba(245, 196, 81, .08);
      color: var(--gold);
      font-weight: 800
    }

    .wallet-badge b {
      direction: ltr;
      font-variant-numeric: tabular-nums
    }

    .brand-wallet {
      flex: 0 0 auto;
      gap: 4px;
      margin: 0;
      padding: 6px 9px;
      font-size: 12px
    }

    /* ---------- start screen ---------- */
    .start-screen { flex:1;display:flex;flex-direction:column;gap:14px;min-height:calc(100dvh - 42px) }
    .start-head { display:flex;align-items:center;justify-content:space-between;gap:12px }
    .start-brand { display:flex;align-items:center;gap:10px;direction:ltr }
    .start-brand .logo { width:46px;height:46px;font-size:19px }
    .start-wordmark { font-weight:900;letter-spacing:1.5px;font-size:17px }
    .start-wordmark small { display:block;direction:rtl;letter-spacing:0;color:var(--mu);font-size:11px;font-weight:600;margin-top:2px }
    .start-hero { flex:1;min-height:330px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:24px 16px 32px;border:1px solid rgba(46,224,138,.36);border-radius:24px;background-image:linear-gradient(180deg,rgba(4,18,11,.34) 0%,rgba(4,18,11,.12) 42%,rgba(4,18,11,.35) 100%),url("./Background.jpg");background-size:cover;background-position:center 25%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06) }
    .start-pitch { position:absolute;z-index:1;inset:12px;border:1.5px solid rgba(255,255,255,.54);border-radius:16px;pointer-events:none }
    .start-pitch::before { content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid rgba(255,255,255,.55) }
    .start-pitch::after { content:"";position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;border:1px solid rgba(255,255,255,.52);border-radius:50%;transform:translate(-50%,-50%) }
    .start-goal { position:absolute;left:50%;width:27%;height:14%;transform:translateX(-50%);border:1px solid rgba(255,255,255,.5) }
    .start-goal.top { top:0;border-top:0 }
    .start-goal.bottom { bottom:0;border-bottom:0 }
    .start-ball { display:none }
    .start-title { position:relative;z-index:2;margin:0 0 7px;font-size:clamp(26px,8vw,34px);font-weight:900;letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,.65) }
    .start-caption { position:relative;z-index:2;color:#e6f2eb;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.8) }
    .start-team-summary { width:100%;min-height:68px;display:flex;align-items:center;gap:clamp(7px,2.5vw,13px);padding:10px 12px;border:1px solid rgba(46,224,138,.22);border-radius:14px;background:linear-gradient(110deg,rgba(18,58,38,.96),rgba(11,32,22,.96));text-align:right;cursor:pointer }
    .start-summary-title { flex:1;min-width:0 }
    .start-summary-title b { display:block;font-size:13px;font-weight:900 }
    .start-summary-title small,.start-summary-value small { display:block;margin-top:3px;color:var(--mu);font-size:10px;white-space:nowrap }
    .start-summary-value { flex:0 0 auto;text-align:center;min-width:34px }
    .start-summary-value b { display:block;font-size:15px;font-weight:900;line-height:1.1 }
    .start-summary-rating { color:var(--gold) }
    .start-summary-arrow { color:var(--ac);font-size:20px }
    .start-play { width:100%;min-height:60px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid rgba(126,240,184,.38);border-radius:15px;background:linear-gradient(100deg,#2ee08a,#19a966);color:#04150d;font-size:18px;font-weight:900;box-shadow:0 8px 24px rgba(46,224,138,.16);cursor:pointer }
    .start-play span { font-size:22px;line-height:1 }
    .start-shortcuts { display:grid;grid-template-columns:1fr 1fr;gap:10px }
    .start-shortcut { min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:13px;background:var(--card);font-weight:800;cursor:pointer }
    .start-shortcut:first-child { background:linear-gradient(150deg,#123a26,#0d2418);border-color:rgba(46,224,138,.25) }
    .start-shortcut:last-child { border-color:rgba(245,196,81,.25);background:rgba(245,196,81,.06) }
    .start-bottom { display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 3px 0;color:var(--mu);font-size:12px }
    .start-bottom button { border:0;background:transparent;color:inherit;padding:8px 2px;cursor:pointer }
    .asset-slot { display:flex }
    .asset-slot:empty { display:none }
    .asset-card { width:100%;display:flex;flex-direction:column;gap:9px;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:var(--card) }
    .asset-row { display:flex;align-items:center;justify-content:space-between;gap:10px }
    .asset-title { display:block;font-size:12.5px;font-weight:900 }
    .asset-meta { display:block;margin-top:3px;color:var(--mu);font-size:11px;font-weight:700;line-height:1.45 }
    .asset-track { height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden }
    .asset-track i { display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--ac),#8df5c4);transition:width .2s ease }
    .asset-dialog-title { margin-bottom:12px;color:var(--tx);font-size:16px;font-weight:900 }
    .asset-progress-text { margin:14px 0 10px;font-size:14px;font-weight:800;color:var(--tx) }
    .asset-progress-text b { color:var(--ac);font-size:20px }
    .asset-hint { margin-top:10px;color:var(--mu);font-size:11.5px;line-height:1.6 }
    .asset-pill { position:fixed;z-index:80;left:50%;bottom:calc(12px + var(--sab));transform:translateX(-50%);width:min(280px,calc(100vw - 28px));padding:9px 12px 10px;border:1px solid rgba(46,224,138,.32);border-radius:999px;background:rgba(7,19,13,.95);box-shadow:0 12px 30px rgba(0,0,0,.5);pointer-events:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px) }
    .asset-pill-text { color:var(--tx);font-size:11px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis }
    .asset-pill .asset-track { height:5px;margin-top:6px }
    @media(max-height:720px) { .start-hero { min-height:260px } .start-screen { min-height:0 } }
    .play-menu { flex:1;display:flex;flex-direction:column;gap:14px }
    .play-club-card { width:100%;min-height:92px;display:flex;align-items:center;gap:12px;padding:15px;border:1px solid rgba(46,224,138,.35);border-radius:16px;background:linear-gradient(145deg,#123a26,#0d2418);text-align:right;cursor:pointer }
    .play-club-card.secondary { border-color:var(--line);background:var(--card) }
    .play-mode-icon { width:46px;height:46px;flex:0 0 auto;display:grid;place-items:center;border-radius:13px;background:rgba(46,224,138,.16);font-size:23px }
    .play-mode-copy { flex:1;min-width:0 }
    .play-mode-copy b { display:block;font-size:15px;font-weight:900 }
    .play-mode-copy small { display:block;margin-top:4px;color:var(--mu);font-size:12px;line-height:1.45 }
    .play-mode-arrow { color:var(--ac);font-size:22px }
    .draft-menu { padding:15px;border:1px solid var(--line);border-radius:17px;background:var(--card) }
    .draft-menu-head { display:flex;align-items:center;gap:10px;margin-bottom:12px }
    .draft-menu-head b { display:block;font-size:16px }
    .draft-menu-head small { display:block;color:var(--mu);font-size:12px;margin-top:3px }
    .draft-menu .field-label { margin:0 0 7px }
    .draft-menu .timer-options { margin-bottom:12px }
    .draft-submodes { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px }
    .draft-submode { min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:9px 5px;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-size:12px;font-weight:800;cursor:pointer }
    .draft-submode span:first-child { font-size:20px }
    .play-back { margin-top:auto }
    @media(max-width:360px) { .draft-menu { padding:12px } .draft-submodes { gap:6px } .draft-submode { font-size:11px } }

    .squad-topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px
    }

    .squad-topbar .wallet-badge {
      flex: 1;
      margin: 0
    }

    .squad-formation-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    .squad-formation-title .sec-title {
      min-width: 0;
      margin: 20px 0 10px
    }

    .squad-formation-title .btn {
      flex: 0 0 auto;
      padding: 7px 10px;
      font-size: 11px
    }

    .coach-management-row {
      display: flex;
      gap: 8px;
      margin-top: 8px
    }

    .coach-management-row #club-coach {
      flex: 1;
      min-width: 0;
      justify-content: flex-start;
      text-align: right
    }

    .coach-collection-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 6px
    }

    .coach-collection-actions .btn {
      padding-inline: 9px;
      font-size: 11px
    }

    /* ---------- mode cards ---------- */
    .mode {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      text-align: right;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 15px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: transform .12s ease, border-color .15s ease, background .15s ease;
    }

    .mode:active {
      transform: scale(.985);
      background: var(--card2)
    }

    .mode.primary {
      border-color: rgba(46, 224, 138, .4);
      background: linear-gradient(150deg, #123a26, #0d2418)
    }

    .mode .ic {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      background: rgba(46, 224, 138, .12);
      font-size: 20px;
    }

    .mode.primary .ic {
      background: rgba(46, 224, 138, .2)
    }

    .mode .tx {
      flex: 1;
      min-width: 0
    }

    .mode b {
      display: block;
      font-size: 15.5px;
      font-weight: 800;
      margin-bottom: 2px
    }

    .mode small {
      display: block;
      font-size: 12.5px;
      color: var(--mu);
      line-height: 1.5
    }

    .mode .arw {
      color: var(--mu);
      font-size: 18px;
      flex: 0 0 auto
    }

    /* ---------- header ---------- */
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px
    }

    .hdr .l {
      min-width: 0
    }

    .hdr .pos {
      font-size: 17px;
      font-weight: 900;
      display: block;
      line-height: 1.2
    }

    .hdr .cnt {
      font-size: 12px;
      color: var(--mu);
      font-weight: 600
    }

    .timer {
      flex: 0 0 auto;
      min-width: 56px;
      height: 44px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 19px;
      background: var(--card);
      border: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
      transition: color .2s, border-color .2s, background .2s;
    }

    .timer.warn {
      color: var(--bad);
      border-color: rgba(255, 93, 93, .45);
      background: rgba(255, 93, 93, .1)
    }

    .bar {
      height: 5px;
      background: rgba(255, 255, 255, .07);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px
    }

    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #2ee08a, #7ef0b8);
      border-radius: 99px;
      transition: width .2s linear
    }

    .bar i.warn {
      background: linear-gradient(90deg, #ff5d5d, #ff9a9a)
    }

    /* ---------- card grid ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(9px, 3vw, 14px)
    }

    .pick-grid {
      align-items: start;
      margin-inline: auto;
      width: 100%
    }

    .formation-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 18px
    }

    .formation-option {
      min-height: 60px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      text-align: center;
      cursor: pointer
    }

    .formation-option.active {
      border-color: var(--ac);
      background: rgba(46, 224, 138, .12);
      color: var(--ac)
    }

    .formation-option b {
      display: block;
      direction: ltr;
      font-size: 15px;
      font-weight: 900
    }

    .formation-option small {
      display: block;
      margin-top: 2px;
      color: var(--mu);
      font-size: 10.5px
    }

    .pitch {
      display: grid;
      position: relative;
      gap: clamp(6px, 2vw, 10px);
      padding: clamp(10px, 3vw, 16px) clamp(6px, 2vw, 12px);
      border: 1px solid rgba(46, 224, 138, .22);
      border-radius: 16px;
      overflow: hidden;
      background:
        linear-gradient(90deg, transparent 49.7%, rgba(255, 255, 255, .1) 49.7% 50.3%, transparent 50.3%),
        repeating-linear-gradient(0deg, #123a26 0 42px, #103321 42px 84px);
    }

    .squad-overall {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 66px;
      height: 42px;
      border: 1px solid rgba(245, 196, 81, .65);
      border-radius: 12px;
      background: rgba(7, 19, 13, .94);
      box-shadow: 0 5px 16px rgba(0, 0, 0, .35), 0 0 12px rgba(245, 196, 81, .16);

    /* ---------- football card ---------- */
    .fc {
      position: relative;
      container-type: inline-size;
      width: 100%;
      aspect-ratio: 3/4.05;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 7% 6% 6%;
      text-align: center;
      direction: ltr;
      clip-path: polygon(50% 0, 100% 6%, 100% 91%, 50% 100%, 0 91%, 0 6%);
      background: linear-gradient(160deg, var(--g1), var(--g2) 52%, var(--g1));
      color: var(--c1);
      user-select: none;
      border: 1px solid rgba(255, 255, 255, .24);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .32), inset 0 0 0 2px rgba(255, 255, 255, .07);
      transition: transform .16s ease, box-shadow .18s ease, filter .18s ease;
    }

    .fc.has-card-art {
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .fc.has-card-art::after {
      display: none;
    }

    .fc-card-art {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
    }

    .fc.has-card-art> :not(.fc-card-art) {
      display: none;
    }

    .fc::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg, rgba(255, 255, 255, .22) 0%, transparent 38%, transparent 62%, rgba(255, 255, 255, .1) 100%);
      mix-blend-mode: overlay;
    }

    .t-icon {
      --g1: #1a1206;
      --g2: #4a3409;
      --c1: #f7d97a
    }

    .t-elite {
      --g1: #08182f;
      --g2: #1d4f8c;
      --c1: #f7d97a
    }

    .t-gold {
      --g1: #8a6410;
      --g2: #eec95f;
      --c1: #2a1d00
    }

    .t-silver {
      --g1: #78838b;
      --g2: #e2eaef;
      --c1: #1d2429
    }

    .t-bronze {
      --g1: #74441f;
      --g2: #d99a63;
      --c1: #2a1608
    }

    .fc-top {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1;
      position: relative;
      z-index: 1
    }

    .fc-top b {
      font-size: 17cqw;
      font-weight: 900;
      letter-spacing: -.04em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .22)
    }

    .fc-top i {
      font-style: normal;
      font-size: 6.6cqw;
      font-weight: 800;
      opacity: .85;
      margin-top: .6cqw
    }

    .fc-era {
      position: absolute;
      top: 8cqw;
      inset-inline-end: 6cqw;
      z-index: 1;
      font-size: 5.2cqw;
      font-weight: 800;
      opacity: .8;
      letter-spacing: .02em;
      padding: 1.8cqw 3.4cqw;
      border: 1px solid currentColor;
      border-radius: 999px;
      background: rgba(0, 0, 0, .13);
    }

    .fc-mono {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 0;
      font-size: 52cqw;
      font-weight: 900;
      opacity: .13;
      line-height: 1;
      padding-top: 6cqw;
    }

    .fc-player-silhouette {
      position: absolute;
      left: 50%;
      bottom: 24%;
      width: 58%;
      height: 43%;
      transform: translateX(-50%);
      z-index: 0;
      color: var(--c1);
      opacity: .24;
    }

    .fc-player-silhouette::before,
    .fc-player-silhouette::after {
      content: "";
      position: absolute;
      background: currentColor;
    }

    .fc-player-silhouette::before {
      top: 0;
      left: 37%;
      width: 26%;
      aspect-ratio: 1;
      border-radius: 50%;
    }

    .fc-player-silhouette::after {
      bottom: 0;
      left: 5%;
      width: 90%;
      height: 69%;
      border-radius: 46% 46% 8% 8%;
      clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%);
    }

    .fc-name {
      margin-top: auto;
      font-size: 9.4cqw;
      font-weight: 900;
      line-height: 1.15;
      direction: rtl;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      position: relative;
      z-index: 1;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .12);
    }

    .fc.squad-player-card .fc-name,
    .fc.bench-player-card .fc-name,
    .fc.formation-player-card .fc-name {
      font-size: 10.4cqw
    }

    .fc-rule {
      height: 1.5px;
      background: currentColor;
      opacity: .35;
      margin: 2.6cqw 4cqw 2.2cqw;
      position: relative;
      z-index: 1
    }

    .fc-meta {
      font-size: clamp(8px, 6.2cqw, 12px);
      font-weight: 700;
      line-height: 1.35;
      direction: rtl;
      opacity: .9;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      position: relative;
      z-index: 1
    }

    /* ---------- coach card ---------- */
    /* Coaches keep the family silhouette (hex clip, name plate, rating) but their
       plate stays matte and the tier lives in the permit rail, keyline and tier word
       instead of the player foil gradient. */
    .fc.coach {
      display: block;
      padding: 0;
      color: var(--tx);
      border-color: rgba(255, 255, 255, .1);
      background:
        radial-gradient(115% 70% at 50% 0%, rgba(255, 255, 255, .07), transparent 62%),
        linear-gradient(180deg, #102a1c, #0a1a12 56%, #07130d);
      box-shadow: none;
      filter: drop-shadow(0 0 1px var(--tier-soft)) drop-shadow(0 7px 16px rgba(0, 0, 0, .42));
    }

    .fc.coach[data-tier="legendary"] {
      --tier: var(--gold);
      --tier-soft: rgba(245, 196, 81, .55)
    }

    .fc.coach[data-tier="regular"] {
      --tier: var(--ac);
      --tier-soft: rgba(46, 224, 138, .55)
    }

    .fc.coach[data-tier="weak"] {
      --tier: var(--bad);
      --tier-soft: rgba(255, 93, 93, .55)
    }

    .fc-coach-pitch {
      position: absolute;
      inset: 10% 7% 25%;
      z-index: 0;
      opacity: .55;
      background-image:
        linear-gradient(to right, transparent calc(50% - .5px), rgba(238, 247, 241, .2) 50%, transparent calc(50% + .5px)),
        repeating-linear-gradient(to bottom, rgba(238, 247, 241, .11) 0 1px, transparent 1px 25%),
        radial-gradient(circle at 50% 46%, transparent 21%, rgba(238, 247, 241, .17) 22%, transparent 23%);
      -webkit-mask-image: radial-gradient(88% 74% at 50% 34%, #000 26%, transparent 100%);
      mask-image: radial-gradient(88% 74% at 50% 34%, #000 26%, transparent 100%)
    }

    .fc-coach-photo {
      position: absolute;
      left: 50%;
      bottom: 22%;
      z-index: 1;
      width: 88%;
      aspect-ratio: 1;
      transform: translateX(-50%);
      object-fit: cover;
      object-position: 50% 2%;
      filter: contrast(1.05) saturate(1.02);
      pointer-events: none;
      user-select: none;
      -webkit-mask-image: linear-gradient(transparent 0, #000 5%, #000 80%, transparent 99%);
      mask-image: linear-gradient(transparent 0, #000 5%, #000 80%, transparent 99%)
    }

    .fc-coach-mono {
      position: absolute;
      top: 10%;
      left: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 100%;
      height: 62%;
      color: var(--tier);
      font-size: 42cqw;
      font-weight: 900;
      line-height: 1;
      opacity: .22
    }

    .fc-coach-spine {
      position: absolute;
      top: 8%;
      right: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.3cqw;
      width: 22%;
      padding: 2.6cqw 3.4cqw 2.8cqw 2cqw;
      border-top: 1px solid rgba(238, 247, 241, .12);
      border-bottom: 1px solid rgba(238, 247, 241, .12);
      border-left: 2px solid var(--tier);
      background: linear-gradient(90deg, rgba(4, 15, 10, .34), rgba(4, 15, 10, .9));
      direction: ltr
    }

    .fc-coach-rating {
      color: var(--tier);
      font-size: clamp(15px, 16.5cqw, 40px);
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums
    }

    .fc-coach-rail {
      width: 56%;
      height: 1px;
      background: rgba(238, 247, 241, .22)
    }

    .fc-coach-effect {
      color: var(--tx);
      font-size: clamp(8px, 6.2cqw, 14px);
      font-weight: 800;
      letter-spacing: -.01em;
      font-variant-numeric: tabular-nums
    }

    .fc-coach-effect.up {
      color: var(--gold)
    }

    .fc-coach-effect.down {
      color: var(--bad)
    }

    .fc-coach-deviation {
      position: relative;
      width: 64%;
      height: 1px;
      margin-top: .8cqw;
      background: rgba(238, 247, 241, .22)
    }

    .fc-coach-deviation::before {
      content: "";
      position: absolute;
      top: -2px;
      left: 50%;
      width: 1px;
      height: 5px;
      background: rgba(238, 247, 241, .42)
    }

    .fc-coach-deviation::after {
      content: "";
      position: absolute;
      top: -3px;
      left: var(--needle, 50%);
      width: 2px;
      height: 7px;
      border-radius: 1px;
      background: var(--tier)
    }

    .fc-coach-plate {
      position: absolute;
      inset-inline: 0;
      bottom: 9.5%;
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: .4cqw;
      padding: 3.2cqw 8% 1cqw 6%;
      background: linear-gradient(180deg, rgba(4, 15, 10, .04), rgba(4, 15, 10, .9) 44%);
      direction: ltr;
      text-align: start
    }

    .fc-coach-plate::before {
      content: "";
      position: absolute;
      top: 0;
      inset-inline: 6%;
      height: 1px;
      background: var(--tier);
      opacity: .5
    }

    .fc-coach-name {
      display: -webkit-box;
      overflow: hidden;
      font-size: clamp(8px, 8.2cqw, 19px);
      font-weight: 900;
      line-height: 1.15;
      text-align: start;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2
    }

    .fc-coach-tier {
      color: var(--tier);
      font-size: clamp(7px, 4.8cqw, 10px);
      font-weight: 800;
      letter-spacing: .1em;
      opacity: .95
    }

    @container (max-width: 150px) {

      .fc-coach-tier,
      .fc-coach-deviation {
        display: none
      }

      .fc-coach-spine {
        gap: .8px;
        width: 26%;
        padding: 2px 0 3px;
        border-left-width: 1.5px
      }

      .fc-coach-plate {
        bottom: 11%;
        padding: 3px 5px 1px
      }

      .fc-coach-name {
        white-space: nowrap;
        -webkit-line-clamp: 1;
        line-clamp: 1
      }

      .fc-coach-pitch {
        opacity: .32
      }
    }

    /* hidden / back card */
    .fc.back {
      background:
        radial-gradient(ellipse at 50% 34%, rgba(46, 224, 138, .14), transparent 43%),
        linear-gradient(155deg, #103320, #07170f 58%, #10281b);
      color: var(--ac);
      display: grid;
      place-items: center;
      border: 0;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(46, 224, 138, .25);
      transition: transform .14s ease, box-shadow .18s ease, filter .18s ease;
    }

    .fc.back::before {
      content: "";
      position: absolute;
      inset: 6%;
      z-index: 0;
      border: 1px solid rgba(46, 224, 138, .2);
      clip-path: polygon(50% 0, 100% 6%, 100% 91%, 50% 100%, 0 91%, 0 6%);
      pointer-events: none;
    }

    .fc.back span {
      position: relative;
      z-index: 1;
      font-size: 22cqw;
      font-weight: 900;
      letter-spacing: .06em;
      text-shadow: 0 0 22px rgba(46, 224, 138, .35);
      opacity: .95
    }

    .fc.back:active {
      transform: scale(.97);
      filter: brightness(1.2)
    }

    .fc.back:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
      z-index: 2
    }

    @media (hover:hover) {
      .fc.back:not(:disabled):hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 26px rgba(0, 0, 0, .42), inset 0 0 0 1px rgba(46, 224, 138, .4)
      }
    }

    .fc.back.used {
      opacity: .28;
      pointer-events: none
    }

    .fc.back.used span {
      font-size: 9cqw
    }

    /* selection states */
    .fc.pick {
      animation: pop .32s cubic-bezier(.2, 1.3, .4, 1) both
    }

    @keyframes pop {
      from {
        transform: scale(.9);
        opacity: .4
      }

      to {
        transform: scale(1);
        opacity: 1
      }
    }

    .fc.dim {
      opacity: .32;
      filter: saturate(.4)
    }

    .fc.win {
      box-shadow: 0 0 0 2px #2ee08a, 0 10px 26px rgba(46, 224, 138, .28), inset 0 0 0 2px rgba(255, 255, 255, .09)
    }

    .fc.lose {
      box-shadow: 0 0 0 2px #ff5d5d, 0 10px 26px rgba(255, 93, 93, .23), inset 0 0 0 2px rgba(255, 255, 255, .08)
    }

    .badge {
      position: absolute;
      top: -7px;
      inset-inline-end: -7px;
      z-index: 3;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 900;
      color: #04150d;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .4);
    }

    .badge.ok {
      background: #2ee08a
    }

    .badge.no {
      background: #ff5d5d;
      color: #fff
    }

    .fcwrap {
      position: relative;
      min-width: 0;
      filter: drop-shadow(0 5px 8px rgba(0, 0, 0, .2))
    }

    .fcwrap:has(> .fc.has-card-art) {
      filter: none
    }

    .pick-actions {
      display: grid;
      gap: 9px;
      margin-top: 16px
    }

    .pick-actions .btn {
      width: 100%;
      min-height: 52px
    }

    .pick-stage {
      position: relative;
      isolation: isolate
    }

    .pick-stage-grid {
      filter: blur(2px);
      opacity: .3;
      transform: scale(.97);
      transition: filter .2s ease, opacity .2s ease, transform .2s ease;
      pointer-events: none
    }

    .pick-card-stack {
      position: relative;
      isolation: isolate;
      width: min(100%, 260px, 42dvh);
      aspect-ratio: 3/4.05;
      margin-inline: auto
    }

    .pick-card-stack .stack-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      filter: blur(1.4px);
      opacity: .72;
      transform-origin: center 85%;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .48)
    }

    .pick-card-stack .stack-back:nth-child(1) {
      z-index: 1;
      transform: rotate(-8deg) translateX(-15px) scale(.96)
    }

    .pick-card-stack .stack-back:nth-child(2) {
      z-index: 2;
      transform: rotate(-3deg) translateY(-4px) scale(.98)
    }

    .pick-card-stack .stack-back:nth-child(3) {
      z-index: 3;
      transform: rotate(8deg) translateX(15px) scale(.96)
    }

    .pick-card-front {
      position: absolute;
      inset: 0;
      z-index: 4;
      filter: drop-shadow(0 12px 20px rgba(0, 0, 0, .48))
    }

    .pick-card-front .fc {
      height: 100%
    }

    .pick-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: calc(18px + var(--sat)) calc(18px + var(--sar)) calc(18px + var(--sab)) calc(18px + var(--sal));
      overflow-y: auto;
      background: rgba(2, 10, 6, .62);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      animation: overlay-in .18s ease both
    }

    .pick-dialog {
      width: min(100%, 340px);
      max-height: calc(100dvh - 36px - var(--sat) - var(--sab));
      overflow-y: auto;
      overflow-x: clip;
      padding: clamp(14px, 4vw, 20px);
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 22px;
      background: linear-gradient(160deg, rgba(17, 43, 29, .97), rgba(7, 19, 13, .98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .58), 0 0 36px rgba(46, 224, 138, .09);
      text-align: center;
      animation: card-zoom-in .32s cubic-bezier(.2, 1.15, .35, 1) both
    }

    .pick-dialog-title {
      margin-bottom: 12px;
      color: var(--mu);
      font-size: 13px;
      font-weight: 700
    }

    .pick-dialog .pick-actions {
      margin-top: 16px
    }

    @keyframes overlay-in {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes card-zoom-in {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.72)
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }

    /* ---------- squad strip ---------- */
    .squad {
      margin-top: 18px
    }

    .squad .lbl {
      font-size: 11.5px;
      color: var(--mu);
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between
    }

    .slots {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none
    }

    .slots::-webkit-scrollbar {
      display: none
    }

    .slot {
      flex: 0 0 auto;
      min-width: 52px;
      height: 34px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 10.5px;
      font-weight: 700;
      background: rgba(255, 255, 255, .04);
      border: 1px dashed rgba(255, 255, 255, .12);
      color: var(--mu);
      padding: 0 8px;
      white-space: nowrap;
    }

    .slot.on {
      background: rgba(46, 224, 138, .13);
      border: 1px solid rgba(46, 224, 138, .35);
      color: var(--ac)
    }

    .slot.now {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(245, 196, 81, .1)
    }

    /* ---------- reveal / opp ---------- */
    .note {
      font-size: 13px;
      color: var(--mu);
      line-height: 1.7;
      margin: 14px 0 0;
      text-align: center
    }

    .note b {
      color: var(--tx)
    }

    .sec-title {
      font-size: 15px;
      font-weight: 800;
      margin: 20px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .sec-title::before {
      content: "";
      width: 3px;
      height: 15px;
      border-radius: 2px;
      background: var(--ac)
    }

    /* ---------- result ---------- */
    .score {
      font-size: clamp(46px, 15vw, 64px);
      font-weight: 900;
      line-height: 1;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
    }

    .verdict {
      font-size: 19px;
      font-weight: 900;
      margin-top: 6px
    }

    .rows {
      margin-top: 16px;
      border-radius: var(--r);
      overflow: hidden;
      border: 1px solid var(--line)
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      font-size: 13.5px
    }

    .row:last-child {
      border-bottom: 0
    }

    .row .r {
      color: var(--mu);
      font-size: 12px;
      font-weight: 700;
      flex: 0 0 auto
    }

    .row .n {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .row .v {
      font-weight: 900;
      color: var(--ac);
      flex: 0 0 auto;
      font-variant-numeric: tabular-nums
    }

    .star-keeper-cover { display:flex;align-items:center;justify-content:center;min-height:126px;direction:ltr;overflow:hidden }
    .star-keeper-cover-card { position:relative;flex:0 1 46px;width:46px;max-width:34%;box-shadow:0 6px 15px rgba(0,0,0,.45) }
    .star-keeper-cover-card:first-child { transform:translateX(5px) rotate(-5deg) scale(.88) }
    .star-keeper-cover-card:nth-child(2) { z-index:1;transform:translateY(-5px) }
    .star-keeper-cover-card:last-child { transform:translateX(-5px) rotate(5deg) scale(.88) }
    .star-keeper-cover-card.is-owned,.keeper-pack-row.is-owned { filter:grayscale(1);opacity:.42 }
    .star-keeper-pack-tile { width:100%;min-height:148px;display:grid;grid-template-columns:minmax(0,1fr) 145px;align-items:center;gap:8px;margin-top:14px;padding:12px;border:1px solid rgba(46,224,138,.4);border-radius:18px;background:linear-gradient(145deg,#123a26,#0d2418);text-align:right;cursor:pointer }
    .star-keeper-pack-tile-copy { display:grid;gap:6px }
    .star-keeper-pack-tile-copy b { font-size:17px }
    .star-keeper-pack-tile-copy small { color:var(--mu);font-size:11px;line-height:1.5 }
    .star-keeper-cover-card .fc { width:100% }
    .keeper-pack-list { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:10px 0 14px }
    .keeper-pack-row { position:relative;min-width:0;border-radius:14px;transition:transform .18s ease,box-shadow .18s ease }
    .keeper-pack-row .fc { width:100% }
    .keeper-pack-row::after { content:"";position:absolute;inset:-3px;border:3px solid transparent;border-radius:16px;pointer-events:none;opacity:0 }
    .keeper-pack-row.opening-highlight { z-index:2 }
    .keeper-pack-row.opening-highlight::after { border-color:#37f596;opacity:1;box-shadow:0 0 10px #20e780,0 0 24px rgba(32,231,128,.8);animation:keeper-pack-loop .42s linear infinite alternate }
    .keeper-pack-row.is-winner { z-index:1;transform:scale(1.035);box-shadow:0 0 0 3px #37f596,0 0 26px rgba(32,231,128,.75) }
    .keeper-pack-owned-tag { position:absolute;z-index:3;inset-inline:3px;bottom:12%;padding:4px 2px;border-radius:999px;background:rgba(20,24,22,.9);color:#d4d8d5;font-size:10px;font-weight:900;text-align:center;pointer-events:none }
    .star-keeper-winner { margin:10px 0;padding:10px 12px;border:1px solid #37f596;border-radius:12px;background:rgba(32,231,128,.12);color:#8dffbd;font-weight:900;text-align:center }
    @keyframes keeper-pack-loop { from { filter:brightness(1);outline-offset:0 } to { filter:brightness(1.6);outline-offset:4px } }

    @media (max-width:390px) {
      .star-keeper-pack-tile { grid-template-columns:minmax(0,1fr) 116px;padding:9px }
      .keeper-pack-list { gap:6px }
    }

    /* Rows that carry sentences instead of values must wrap instead of truncating. */
    .rows-text .row {
      align-items: flex-start
    }

    .rows-text .row .n {
      overflow: visible;
      line-height: 1.75;
      white-space: normal
    }

    /* Compact draft selection on short screens: keep both card rows visible without page scrolling. */
    @media (max-height: 760px) {
      #app:has(.pick-grid) {
        padding-top: calc(6px + var(--sat));
        padding-bottom: calc(8px + var(--sab));
      }
      #app:has(.pick-grid) .note {
        margin-top: 6px;
        font-size: 11px;
        line-height: 1.35;
      }
      .pick-grid {
        gap: clamp(6px, 1vh, 10px);
        margin-top: 8px !important;
      }
      .pick-grid > .fc,
      .pick-grid > .fcwrap {
        width: min(100%, 145px);
        justify-self: center;
      }
      .squad { margin-top: 8px; }
      .squad .lbl { margin-bottom: 4px; }
      .slots { gap: 4px; }
      .slot { min-width: 44px; height: 30px; padding-inline: 5px; font-size: 9px; }
    }

    /* ---------- misc ---------- */
    .input {
      width: 100%;
      padding: 14px;
      border-radius: 13px;
      border: 1.5px solid var(--line);
      background: var(--card);
      color: var(--tx);
      font: inherit;
      font-size: 20px;
      text-align: center;
      letter-spacing: .3em;
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 12px;
    }

    .input::placeholder {
      letter-spacing: normal;
      font-size: 14px;
      font-weight: 600;
      color: var(--mu);
      text-transform: none
    }

    .input:focus {
      outline: none;
      border-color: var(--ac)
    }

    .toast {
      position: fixed;
      inset-inline: 0;
      bottom: calc(22px + var(--sab));
      z-index: 99;
      display: flex;
      justify-content: center;
      pointer-events: none;
      padding: 0 16px;
    }

    .toast i {
      background: #eef7f1;
      color: #07130d;
      padding: 10px 18px;
      border-radius: 12px;
      font-style: normal;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
      animation: tin .22s ease both;
      max-width: 100%;
      text-align: center;
    }

    @keyframes tin {
      from {
        transform: translateY(10px);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .spin {
      width: 34px;
      height: 34px;
      border-radius: 50%;

      }

      }

      }

  </style>
  <script>
    (function () {
      var shown = false;
      function showError(detail) {
        if (shown) return;
        shown = true;
        console.error("GG runtime error:", detail);
        var app = document.getElementById("app");
        if (!app) return;
        if (app.childElementCount) {
          if (typeof window.toast === "function") window.toast("حصل خطأ غير متوقع، جرّب تحديث الصفحة");
          return;
        }
        app.innerHTML = '<div class="rows"><div class="row"><span class="n">حصل خطأ غير متوقع. حدّث الصفحة وجرّب تاني.</span></div></div>';
        var button = document.createElement("button");
        button.type = "button";
        button.className = "btn w mt";
        button.textContent = "تحديث الصفحة";
        button.onclick = function () { location.reload(); };
        app.appendChild(button);
      }
      window.addEventListener("error", function (event) {
        showError(event && event.error ? event.error.message : event && event.message);
      });
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event && event.reason;
        showError(reason && reason.message ? reason.message : reason);
      });
    })();
  </script>
</head>

<script>
  var V = Math.floor(Date.now() / 3600000); // يتغير كل ساعة

   "js/12-assets.js"].forEach(function (f) {
    document.write('<script src="./' + f + '?v=' + V + '"><\/script>');
  });
</script>
<script>
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (error) {
        console.warn("Service worker registration failed:", error);
      });
    });
  }
</script>
